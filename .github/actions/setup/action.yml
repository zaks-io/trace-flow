name: Setup workspace
description: Check out the repository and install the pinned workspace toolchain.
inputs:
  fetch-depth:
    description: Git history depth, or 0 for the complete affected comparison history.
    default: '2'
  persist-credentials:
    description: Retain checkout credentials only when the caller already requires them.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
