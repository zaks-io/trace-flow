name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_LOG_VERBOSITY: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      duplicates: ${{ steps.filter.outputs.duplicates }}
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      root: ${{ steps.filter.outputs.root }}
      workflows: ${{ steps.filter.outputs.workflows }}
      tinybird: ${{ steps.filter.outputs.tinybird }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            duplicates:
              - '.jscpd.json'
              - 'package.json'
              - 'bun.lock'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'scripts/**/*.ts'
              - 'scripts/**/*.tsx'
              - 'scripts/**/*.js'
              - 'scripts/**/*.jsx'
              - 'scripts/**/*.mjs'
              - 'scripts/**/*.cjs'
            rust:
              - '.github/workflows/ci.yml'
              - '.github/workflows/cli-release.yml'
              - '.github/workflows/desktop-release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'dist-workspace.toml'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'packages/collector-*/**'
              - 'apps/cli/**'
              - 'apps/desktop/**'
            desktop:
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'bun.lock'
              - 'packages/collector-*/**'
              - 'apps/desktop/**'
            root:
              - 'package.json'
              - '.github/actions/setup/**'
              - 'patches/**'
              - 'bun.lock'
              - 'turbo.json'
              - 'eslint.config.js'
              - '.jscpd.json'
              - '.prettierrc'
              - '.prettierignore'
              - 'tsconfig.json'
            workflows:
              - 'scripts/ci/tinybird-*'
              - 'scripts/ci/verify-tinybird-resources*'
              - 'datasources/**'
              - 'pipes/**'
              - 'scripts/ci/configure-agent-tinybird-tokens*'
              - 'scripts/ci/configure-proxy-tinybird-token*'
              - 'scripts/ci/provision-agent-delivery*'
              - 'scripts/ci/workflow-permissions.test.mjs'
              - 'scripts/ci/ubuntu_https_sources.py'
              - 'scripts/ci/ubuntu_https_sources_test.py'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'turbo.json'
              - 'scripts/bench/**'
              - 'scripts/ci/deploy-agent-tinybird-tree.test.sh'
              - 'scripts/deploy-agent-tinybird.sh'
            tinybird:
              - 'copies/**'
              - 'datasources/**'
              - 'fixtures/**'
              - 'materializations/**'
              - 'pipes/**'
              - 'tests/**'
              - 'tinybird.config.json'
              - 'scripts/ci/*tinybird-local-fixture-tests*'
              - 'scripts/ci/tinybird-*'
              - 'scripts/ci/verify-tinybird-resources*'
              - 'scripts/ci/deploy-agent-tinybird-tree.test.sh'
              - 'scripts/deploy-agent-tinybird.sh'
              - 'scripts/tinybird-agent-signal-performance-report.sh'
              - 'scripts/verify-agent-signal-query-guardrails.mjs'
              - 'scripts/verify-tinybird-copy-policy.sh'
              - 'scripts/verify-tinybird-cost-contract.sh'

  affected:
    name: Affected Package Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    permissions:
      contents: read
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      VITEST_MAX_WORKERS: 2
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
      NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
      NEXT_PUBLIC_PIPES_API_URL: https://pipes.trace-flow.dev
      NEXT_PUBLIC_RAW_API_URL: https://raw.trace-flow.dev
    steps:
      # A local composite action needs its bootstrap checkout before it can be loaded.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Format check
        run: bun prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"
      - name: Check unused code
        run: bun run knip
      - name: Select package check scope
        id: selection
        env:
          ROOT_CHANGED: ${{ needs.changes.outputs.root }}
        run: |
          if [[ "$ROOT_CHANGED" == 'true' ]]; then
            echo 'flags=' >> "$GITHUB_OUTPUT"
          else
            echo 'flags=--affected' >> "$GITHUB_OUTPUT"
          fi
      - name: Select affected packages
        id: graph
        run: |
          bun turbo run lint type-check test build ${{ steps.selection.outputs.flags }} --concurrency=2 --dry=json > "$RUNNER_TEMP/turbo-affected.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/turbo-affected.json`, 'utf8'));
          console.log(`mcp=${graph.packages.includes('@trace-flow/mcp')}`);
          NODE
      - name: Check affected packages
        run: bun turbo run lint type-check test build ${{ steps.selection.outputs.flags }} --concurrency=2 --summarize
      - name: Validate affected MCP environments
        if: steps.graph.outputs.mcp == 'true'
        working-directory: apps/mcp
        run: |
          bunx wrangler deploy --env="" --dry-run
          bunx wrangler deploy --env preview --dry-run
          bunx wrangler deploy --env production --dry-run

  actionlint:
    name: Lint GitHub Actions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test workflow helpers
        run: |
          bun test \
            scripts/ci/configure-agent-tinybird-tokens.test.mjs \
            scripts/ci/provision-agent-delivery.test.mjs \
            scripts/ci/tinybird-destructive-diff.test.mjs \
            scripts/ci/verify-tinybird-resources.test.mjs \
            scripts/ci/workflow-permissions.test.mjs
          node --test scripts/ci/configure-proxy-tinybird-token.test.mjs
          python3 scripts/ci/ubuntu_https_sources_test.py
          python3 -m unittest discover -s scripts/bench -p 'test_*.py'
          bash scripts/ci/deploy-agent-tinybird-tree.test.sh
      - uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12

  # Tinybird's recommended CI pattern (docs: forward/test-and-deploy/deployments/cicd): build + fixture
  # tests against a Tinybird Local service container (offline, no token), then a cloud deploy --check
  # dry-run against trace_flow_prod. The local steps catch pipe SQL that compiles and deploys clean but
  # returns wrong rows (tests/*.yaml); the cloud check catches incompatible/destructive migrations.
  tinybird-schema-check:
    name: Tinybird Schema Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.changes.outputs.tinybird == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    services:
      tinybird-local:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 7181:7181
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          fetch-depth: 1

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Offline against the Local service container: schema build + fixture/output tests. No token.
      - name: Build and test against Tinybird Local
        run: |
          node scripts/ci/configure-agent-tinybird-tokens-datafiles.mjs --validate-datafiles .
          bash scripts/verify-tinybird-cost-contract.sh
          node scripts/verify-agent-signal-query-guardrails.mjs
          tb --local build
          bash scripts/ci/run-tinybird-local-fixture-tests.sh
        env:
          TB_VERSION_WARNING: 0

      # Cloud validation lists the approved retirement drop inventory without applying it.
      - name: Tinybird deploy --check (trace_flow_prod)
        # Keep local schema validation available to contributors without cloud secrets.
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.actor != 'dependabot[bot]')
        run: |
          bash scripts/ci/deploy-agent-tinybird-tree.test.sh
          ./scripts/deploy-agent-tinybird.sh --check
        env:
          TB_TOKEN: ${{ secrets.TINYBIRD_DEPLOY_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          TB_VERSION_WARNING: 0

  duplicates:
    name: Duplicate Code Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.duplicates == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test ingest recovery tooling
        run: |
          node --test scripts/ci/body-retention.test.mjs scripts/ingest-recovery/worker.test.mjs

      - name: Check duplicate code
        run: bun run duplicates:check

  # Collector Rust workspace (packages/collector-*, apps/cli, apps/desktop). Kept out of Turbo.
  # fmt is OS-independent so it runs once on linux; check/test/clippy run per OS because the CLI
  # and desktop shell touch platform-specific keychain, path, tray, and webview code.
  rust:
    name: Rust Collector (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
          - name: windows
            runner: blacksmith-4vcpu-windows-2025
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # Linux build deps for the Collector workspace:
      #   - keyring's D-Bus Secret Service backend (sync-secret-service → dbus → libdbus-sys)
      #   - reqwest/openssl needs libssl
      #   - the Tauri desktop crate (apps/desktop) needs GTK/WebKit + the appindicator tray lib
      # macOS/Windows use native keychains + system webviews and don't need these.
      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo "$(command -v python3)" scripts/ci/ubuntu_https_sources.py
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Format
        if: matrix.name == 'linux'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop-build:
    name: Tauri Desktop Build (macOS)
    runs-on: blacksmith-6vcpu-macos-latest
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APPLE_SIGNING_IDENTITY: '-'
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Build Tauri desktop bundle
        run: bun --cwd apps/desktop run desktop:build -- --target aarch64-apple-darwin

  status:
    name: CI Status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - changes
      - affected
      - actionlint
      - tinybird-schema-check
      - duplicates
      - rust
      - desktop-build
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          else
            echo "All jobs completed successfully"
          fi
