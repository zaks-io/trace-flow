name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      proxy-consumer: ${{ steps.filter.outputs.proxy-consumer }}
      web: ${{ steps.filter.outputs.web }}
      utils: ${{ steps.filter.outputs.utils }}
      types: ${{ steps.filter.outputs.types }}
      root: ${{ steps.filter.outputs.root }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'workers/proxy/**'
              - 'packages/utils/**'
              - 'packages/types/**'
            proxy-consumer:
              - 'workers/proxy-consumer/**'
              - 'packages/utils/**'
              - 'packages/types/**'
            web:
              - 'workers/web/**'
              - 'packages/utils/**'
              - 'packages/types/**'
            utils:
              - 'packages/utils/**'
            types:
              - 'packages/types/**'
            root:
              - 'package.json'
              - 'bun.lockb'
              - 'turbo.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - 'tsconfig.json'
            workflows:
              - '.github/workflows/**'

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: devops-actions/actionlint@v0.1.3

  utils:
    name: Utils Package
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.utils == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run prettier --check "packages/utils/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bun run turbo run lint --filter=@observe/utils

      - name: Type check
        run: bun run turbo run type-check --filter=@observe/utils

      - name: Test
        run: bun run turbo run test --filter=@observe/utils

  types:
    name: Types Package
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.types == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run prettier --check "packages/types/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bun run turbo run lint --filter=@observe/types

      - name: Type check
        run: bun run turbo run type-check --filter=@observe/types

  proxy:
    name: Proxy Worker
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.proxy == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run prettier --check "workers/proxy/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bun run turbo run lint --filter=@observe/proxy

      - name: Type check
        run: bun run turbo run type-check --filter=@observe/proxy

      - name: Test with coverage
        run: bun run turbo run test:coverage --filter=@observe/proxy

      - name: Report coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: workers/proxy
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes

      - name: Build
        run: bun run turbo run build --filter=@observe/proxy

  proxy-consumer:
    name: Proxy Consumer Worker
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.proxy-consumer == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run prettier --check "workers/proxy-consumer/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bun run turbo run lint --filter=@observe/proxy-consumer

      - name: Type check
        run: bun run turbo run type-check --filter=@observe/proxy-consumer

      - name: Test with coverage
        run: bun run turbo run test:coverage --filter=@observe/proxy-consumer

      - name: Report coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: workers/proxy-consumer
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes

      - name: Build
        run: bun run turbo run build --filter=@observe/proxy-consumer

  web:
    name: Web Worker
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: workers/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb') }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run prettier --check "workers/web/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Lint
        run: bun run turbo run lint --filter=@observe/web

      - name: Type check
        run: bun run turbo run type-check --filter=@observe/web

      - name: Test
        run: bun run turbo run test --filter=@observe/web

      - name: Build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
        run: bun run turbo run build --filter=@observe/web

  status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - actionlint
      - utils
      - types
      - proxy
      - proxy-consumer
      - web
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          else
            echo "All jobs completed successfully"
          fi
