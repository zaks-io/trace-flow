name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_LOG_VERBOSITY: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      proxy-consumer: ${{ steps.filter.outputs.proxy-consumer }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      utils: ${{ steps.filter.outputs.utils }}
      types: ${{ steps.filter.outputs.types }}
      convex: ${{ steps.filter.outputs.convex }}
      pricing: ${{ steps.filter.outputs.pricing }}
      agent-ingest: ${{ steps.filter.outputs.agent-ingest }}
      agent-consumer: ${{ steps.filter.outputs.agent-consumer }}
      rust: ${{ steps.filter.outputs.rust }}
      root: ${{ steps.filter.outputs.root }}
      workflows: ${{ steps.filter.outputs.workflows }}
      tinybird: ${{ steps.filter.outputs.tinybird }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'apps/proxy/**'
              - 'packages/utils/**'
              - 'packages/types/**'
            proxy-consumer:
              - 'apps/proxy-consumer/**'
              - 'packages/utils/**'
              - 'packages/types/**'
              - 'packages/pricing/**'
            api:
              - 'apps/api/**'
              - 'packages/types/**'
              - 'packages/logging/**'
              - 'packages/utils/**'
            web:
              - 'apps/web/**'
              - 'packages/utils/**'
              - 'packages/types/**'
            utils:
              - 'packages/utils/**'
            types:
              - 'packages/types/**'
            convex:
              - 'packages/convex/**'
            pricing:
              - 'packages/pricing/**'
              - 'packages/types/**'
            agent-ingest:
              - 'apps/agent-ingest/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'packages/logging/**'
            agent-consumer:
              - 'apps/agent-consumer/**'
              - 'packages/types/**'
              - 'packages/logging/**'
              - 'packages/pricing/**'
              - 'packages/tinybird-client/**'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/collector-*/**'
              - 'apps/cli/**'
              - 'apps/desktop/src-tauri/**'
              - '.github/workflows/ci.yml'
            root:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - 'tsconfig.json'
            workflows:
              - '.github/workflows/**'
            tinybird:
              - 'datasources/**'
              - 'pipes/**'

  actionlint:
    name: Lint GitHub Actions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: devops-actions/actionlint@v0.1.3

  # Tinybird's recommended CI pattern (docs: forward/test-and-deploy/deployments/cicd): build + fixture
  # tests against a Tinybird Local service container (offline, no token), then a cloud deploy --check
  # dry-run against trace_flow_prod. The local steps catch pipe SQL that compiles and deploys clean but
  # returns wrong rows (tests/*.yaml); the cloud check catches incompatible/destructive migrations.
  tinybird-schema-check:
    name: Tinybird Schema Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.tinybird == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    services:
      tinybird-local:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 7181:7181
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Offline against the Local service container: schema build + fixture/output tests. No token.
      - name: Build and test against Tinybird Local
        run: |
          tb --local build
          tb --local test run
        env:
          TB_VERSION_WARNING: 0

      # Cloud dry-run diff against trace_flow_prod. Fails the PR on an incompatible/destructive migration
      # before it can merge. Token resolves to the prod workspace; the script's guard refuses otherwise.
      - name: Tinybird deploy --check (trace_flow_prod)
        run: ./scripts/deploy-agent-tinybird.sh --check
        env:
          TB_TARGET_WORKSPACE: trace_flow_prod
          TB_TOKEN: ${{ secrets.TINYBIRD_DEPLOY_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          TB_VERSION_WARNING: 0

  utils:
    name: Utils Package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.utils == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "packages/utils/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/utils

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/utils

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/utils

  types:
    name: Types Package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.types == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "packages/types/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/types

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/types

  convex:
    name: Convex Backend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.convex == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "packages/convex/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/convex

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/convex

      - name: Test
        run: bun --cwd packages/convex test

  proxy:
    name: Proxy Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.proxy == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/proxy/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/proxy

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/proxy

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/proxy

      - name: Build
        run: bunx turbo run build --filter=@trace-flow/proxy

  proxy-consumer:
    name: Proxy Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.proxy-consumer == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/proxy-consumer/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/proxy-consumer

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/proxy-consumer

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/proxy-consumer

      - name: Build
        run: bunx turbo run build --filter=@trace-flow/proxy-consumer

  api:
    name: API Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/api/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/api

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/api

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/api

  web:
    name: Web Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/web/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/web

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/web

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/web

      - name: Build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
        run: bunx turbo run build --filter=@trace-flow/web

  pricing:
    name: Pricing Package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.pricing == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "packages/pricing/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/pricing

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/pricing

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/pricing

  agent-ingest:
    name: Agent Ingest Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.agent-ingest == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/agent-ingest/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/agent-ingest

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/agent-ingest

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/agent-ingest

      - name: Build
        run: bunx turbo run build --filter=@trace-flow/agent-ingest

  agent-consumer:
    name: Agent Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    if: needs.changes.outputs.agent-consumer == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "apps/agent-consumer/**/*.{ts,tsx,js,jsx,json}"

      - name: Lint
        run: bunx turbo run lint --filter=@trace-flow/agent-consumer

      - name: Type check
        run: bunx turbo run type-check --filter=@trace-flow/agent-consumer

      - name: Test
        run: bunx turbo run test --filter=@trace-flow/agent-consumer

      - name: Build
        run: bunx turbo run build --filter=@trace-flow/agent-consumer

  # Collector Rust workspace (packages/collector-*, apps/cli). Kept out of Turbo — a dedicated
  # cargo job per TRA-111. fmt is OS-independent so it runs once on linux; check/test/clippy run on
  # each OS because the CLI's keyring/path code is platform-specific.
  rust:
    name: Rust Collector (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      # Linux build deps for the Collector workspace:
      #   - keyring's D-Bus Secret Service backend (sync-secret-service → dbus → libdbus-sys)
      #   - reqwest/openssl needs libssl
      #   - the Tauri desktop crate (apps/desktop) needs GTK/WebKit + the appindicator tray lib
      # macOS/Windows use native keychains + system webviews and don't need these.
      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Format
        if: matrix.name == 'linux'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  status:
    name: CI Status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - changes
      - actionlint
      - tinybird-schema-check
      - utils
      - types
      - convex
      - proxy
      - proxy-consumer
      - api
      - web
      - pricing
      - agent-ingest
      - agent-consumer
      - rust
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          else
            echo "All jobs completed successfully"
          fi
