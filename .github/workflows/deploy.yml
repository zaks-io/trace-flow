name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to: <production>'
        required: true
        default: 'production'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TURBO_LOG_VERBOSITY: 1

jobs:
  ci:
    name: CI Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: |
          node --test scripts/ci/body-retention.test.mjs scripts/ingest-recovery/worker.test.mjs
          bun run test

      - name: Install Linux system dependencies
        run: |
          sudo "$(command -v python3)" scripts/ci/ubuntu_https_sources.py
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: . -> target

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust test
        run: cargo test --workspace --locked

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build CLI release artifact
        run: cargo build --release -p trace-flow-cli --locked

  deploy-convex:
    name: Deploy Convex
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Readers must understand analytics identifiers before Convex issues scoped tokens for them.
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    outputs:
      convex_url: ${{ steps.deploy.outputs.convex_url }}
      convex_site_url: ${{ steps.deploy.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Convex query tracing
        run: |
          test -n "$SENTRY_DSN"
          test -n "$PIPES_API_SHARED_SECRET"
          test -n "$BODY_ACCESS_JWT_SECRET"
          bunx convex env set SENTRY_DSN "$SENTRY_DSN" --prod
          bunx convex env set SENTRY_ENVIRONMENT prod --prod
          bunx convex env set AGENT_INGEST_URL https://collector.trace-flow.dev --prod
          printf '%s' "$PIPES_API_SHARED_SECRET" |
            bunx convex env set --prod PIPES_API_SHARED_SECRET
          printf '%s' "$BODY_ACCESS_JWT_SECRET" |
            bunx convex env set --prod BODY_ACCESS_JWT_SECRET
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          PIPES_API_SHARED_SECRET: ${{ secrets.PIPES_API_SHARED_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}

      - name: Deploy Convex
        id: deploy
        run: |
          bunx convex deploy \
            --cmd 'bash scripts/ci/export-convex-outputs.sh' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Splitch configuration sync
        run: bunx convex run integrations/splitch:install --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy-web:
    name: Deploy Web Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex]
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web
        run: bunx opennextjs-cloudflare build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.deploy-convex.outputs.convex_url }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_API_URL: https://raw.trace-flow.dev
          NEXT_PUBLIC_PIPES_API_URL: https://pipes.trace-flow.dev
          NEXT_PUBLIC_RAW_API_URL: https://raw.trace-flow.dev
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: prod
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NEXT_PUBLIC_DEPLOY_ID: ${{ github.sha }}

      - name: Deploy Web Worker
        run: bun opennextjs-cloudflare deploy --env production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-proxy:
    name: Deploy Proxy Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex, deploy-proxy-consumer]
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Proxy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy
          command: deploy --env production --var CONVEX_SITE_URL:${{ needs.deploy-convex.outputs.convex_site_url }}
          packageManager: bun

      # The proxy refuses every request with 503 when its secrets fail startup validation.
      # A bad BODY_ENCRYPTION_ROOT_KEY otherwise only surfaces as truncated response bodies.
      - name: Verify Proxy Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://gateway.trace-flow.dev/healthz

  # Schema must land before any consumer ships, or a consumer can write rows in the new shape while the
  # live workspace still has the old schema -> inserts rejected into _quarantine. Both
  # consumers `needs:` this job. A no-op (no schema diff) is a clean exit; `tb --cloud deploy` reports
  # "no changes" and succeeds.
  deploy-tinybird-schema:
    name: Deploy Tinybird Schema
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy schema in trace_flow_prod
        run: ./scripts/deploy-agent-tinybird.sh
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TB_TOKEN: ${{ secrets.TINYBIRD_DEPLOY_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          TB_VERSION_WARNING: 0
          # No Tinybird Local container here; offline `tb build` (dev_mode=local) is the PR-gate's job.
          # `tb --cloud deploy --check` validates against the live workspace before the apply.
          TB_SKIP_BUILD: 1

  prepare-agent-delivery:
    name: Prepare Agent Delivery Infrastructure
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision delivery storage and snapshot queue
        run: |
          bun scripts/ci/provision-agent-delivery.mjs prod
          bun scripts/setup-r2-lifecycle.ts trace-flow-agent-deliveries-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure scoped Tinybird and delivery encryption secrets
        run: |
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          umask 077
          consumer_secrets="$secrets_directory/consumer.env"
          ingest_secrets="$secrets_directory/ingest.env"
          test -n "$BODY_ENCRYPTION_ROOT_KEY"
          bun scripts/ci/configure-agent-tinybird-tokens.mjs "$consumer_secrets"
          printf 'BODY_ENCRYPTION_ROOT_KEY=%s\n' "$BODY_ENCRYPTION_ROOT_KEY" >> "$consumer_secrets"
          printf 'BODY_ENCRYPTION_ROOT_KEY=%s\n' "$BODY_ENCRYPTION_ROOT_KEY" > "$ingest_secrets"
          (cd apps/agent-consumer && bunx wrangler secret bulk "$consumer_secrets" --env production)
          (cd apps/agent-ingest && bunx wrangler secret bulk "$ingest_secrets" --env production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BODY_ENCRYPTION_ROOT_KEY: ${{ secrets.AGENT_DELIVERY_ENCRYPTION_ROOT_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TB_TOKEN: ${{ secrets.TINYBIRD_OPERATOR_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co

  deploy-proxy-consumer:
    name: Deploy Proxy Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure R2 retention
        run: |
          node --test scripts/ci/body-retention.test.mjs
          bun scripts/setup-r2-lifecycle.ts \
            trace-flow-storage-prod \
            trace-flow-analyst-sandbox-backups-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Proxy Consumer Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy-consumer
          command: deploy --env production
          packageManager: bun

  deploy-api:
    name: Deploy Read API Workers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex]
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Raw API Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          environment: production
          command: deploy --env production --var CONVEX_SITE_URL:${{ needs.deploy-convex.outputs.convex_site_url }}
          packageManager: bun
          secrets: BODY_ACCESS_JWT_SECRET
        env:
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}

      - name: Deploy Pipes API Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pipes-api
          environment: production
          command: deploy --env production --var CONVEX_SITE_URL:${{ needs.deploy-convex.outputs.convex_site_url }}
          packageManager: bun
          secrets: |
            SENTRY_DSN
            PIPES_API_SHARED_SECRET
        env:
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          PIPES_API_SHARED_SECRET: ${{ secrets.PIPES_API_SHARED_SECRET }}

  # MCP worker verifies access tokens via Convex JWKS, so Convex must deploy first.
  deploy-mcp:
    name: Deploy MCP Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex]
    environment: Production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp
          command: deploy --env production
          packageManager: bun

  # Agent pipeline: prod-named workers bound to prod queue/DLQ/KV via the
  # [env.production] blocks, deployed with `--env production`. A guard step asserts the resolved prod
  # config binds no dev resources before either Worker deploys.
  deploy-agent-ingest:
    name: Deploy Agent Ingest Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex, switch-agent-tinybird, deploy-agent-consumer]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Ingest Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-ingest
          command: deploy --env production --var CONVEX_SITE_URL:${{ needs.deploy-convex.outputs.convex_site_url }}
          packageManager: bun

  deploy-agent-consumer:
    name: Deploy Agent Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema, prepare-agent-delivery]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Consumer Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-consumer
          command: deploy --env production
          packageManager: bun

  switch-agent-tinybird:
    name: Verify Agent Tinybird Resources
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ci, deploy-agent-consumer]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify live Tinybird resources
        run: bun scripts/ci/verify-tinybird-resources.mjs
        env:
          TB_TOKEN: ${{ secrets.TINYBIRD_OPERATOR_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co

  deploy-status:
    name: Deployment Status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - ci
      - deploy-convex
      - deploy-web
      - deploy-proxy
      - deploy-tinybird-schema
      - deploy-proxy-consumer
      - deploy-api
      - deploy-mcp
      - deploy-agent-ingest
      - deploy-agent-consumer
      - prepare-agent-delivery
      - switch-agent-tinybird
    steps:
      - name: Check deployment statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more deployments failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more deployments were cancelled"
            exit 1
          else
            echo "All deployments completed successfully"
          fi

  linear-release:
    name: Sync production release to Linear
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: needs.deploy-status.result == 'success'
    needs: [deploy-status]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync production release to Linear
        uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f # v0.14.5
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          include_paths: apps/web/**,apps/proxy/**,apps/proxy-consumer/**,apps/api/**,apps/pipes-api/**,apps/mcp/**,apps/agent-ingest/**,apps/agent-consumer/**,packages/convex/**,packages/emails/**,packages/mcp-core/**,packages/types/**,packages/utils/**,packages/tinybird-client/**,packages/otel-conventions/**,packages/spans/**,packages/llm-providers/**,packages/pricing/**,packages/logging/**,datasources/**,pipes/**,scripts/assert-agent-prod-resources.sh,scripts/deploy-agent-tinybird.sh,scripts/ci/**,.github/workflows/deploy.yml,package.json,bun.lock,turbo.json
