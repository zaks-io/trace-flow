name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to: <production>'
        required: true
        default: 'production'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TURBO_LOG_VERBOSITY: 1

jobs:
  ci:
    name: CI Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

  deploy-convex-and-web:
    name: Deploy Convex and Web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex and Build Web
        run: |
          bunx convex deploy \
            --cmd 'cd apps/web && bunx opennextjs-cloudflare build' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID: ${{ vars.NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NEXT_PUBLIC_DEPLOY_ID: ${{ github.sha }}

      - name: Deploy Web (Workers)
        run: bun opennextjs-cloudflare deploy --env production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-proxy:
    name: Deploy Proxy Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Proxy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy
          command: deploy --env production
          packageManager: bun

  # Schema must land before any consumer ships, or a consumer can write rows in the new shape while the
  # live workspace still has the old schema -> inserts rejected into _quarantine (TRA-118). Both
  # consumers `needs:` this job. A no-op (no schema diff) is a clean exit; `tb --cloud deploy` reports
  # "no changes" and succeeds.
  deploy-tinybird-schema:
    name: Deploy Tinybird Schema
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `tb build` + `tb --cloud deploy --check` then `tb --cloud deploy`, all scoped to trace_flow_prod
      # by the deploy token. The script's guard refuses to apply if the token resolves to any other
      # workspace.
      - name: Deploy schema to trace_flow_prod
        run: ./scripts/deploy-agent-tinybird.sh
        env:
          TB_TARGET_WORKSPACE: trace_flow_prod
          TB_TOKEN: ${{ secrets.TINYBIRD_DEPLOY_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          TB_VERSION_WARNING: 0
          # No Tinybird Local container here; offline `tb build` (dev_mode=local) is the PR-gate's job.
          # `tb --cloud deploy --check` validates against the live workspace before the apply.
          TB_SKIP_BUILD: 1

  deploy-proxy-consumer:
    name: Deploy Proxy Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Proxy Consumer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy-consumer
          command: deploy --env production
          packageManager: bun

  deploy-api:
    name: Deploy API Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production
          packageManager: bun

  # Agent pipeline (TRA-110). Production-real: prod-named workers bound to prod queue/DLQ/KV via the
  # [env.production] blocks, deployed with `--env production`. A guard step asserts the resolved prod
  # config binds no dev resources before either Worker deploys.
  deploy-agent-ingest:
    name: Deploy Agent Ingest Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Ingest Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-ingest
          command: deploy --env production
          packageManager: bun

  deploy-agent-consumer:
    name: Deploy Agent Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Consumer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-consumer
          command: deploy --env production
          packageManager: bun

  deploy-status:
    name: Deployment Status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - deploy-convex-and-web
      - deploy-proxy
      - deploy-tinybird-schema
      - deploy-proxy-consumer
      - deploy-api
      - deploy-agent-ingest
      - deploy-agent-consumer
    steps:
      - name: Check deployment statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more deployments failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more deployments were cancelled"
            exit 1
          else
            echo "All deployments completed successfully"
          fi
