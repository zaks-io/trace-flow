name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to: <production>'
        required: true
        default: 'production'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TURBO_LOG_VERBOSITY: 1

jobs:
  ci:
    name: CI Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: . -> target

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust test
        run: cargo test --workspace --locked

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build CLI release artifact
        run: cargo build --release -p trace-flow-cli --locked

  deploy-convex-and-web:
    name: Deploy Convex and Web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex and Build Web
        run: |
          bunx convex deploy \
            --cmd 'cd apps/web && bunx opennextjs-cloudflare build' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID: ${{ vars.NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NEXT_PUBLIC_DEPLOY_ID: ${{ github.sha }}

      - name: Deploy Web (Workers)
        run: bun opennextjs-cloudflare deploy --env production
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-proxy:
    name: Deploy Proxy Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Proxy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy
          command: deploy --env production
          packageManager: bun

  # Schema must land before any consumer ships, or a consumer can write rows in the new shape while the
  # live workspace still has the old schema -> inserts rejected into _quarantine (TRA-118). Both
  # consumers `needs:` this job. A no-op (no schema diff) is a clean exit; `tb --cloud deploy` reports
  # "no changes" and succeeds.
  deploy-tinybird-schema:
    name: Deploy Tinybird Schema
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tinybird CLI
        run: |
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Automatic production deploy is the non-destructive expansion phase: new clean resources are
      # deployed while legacy resources and legacy endpoint pipes remain live. Switch/cleanup are
      # separate explicit operator steps after backfill and parity.
      - name: Deploy schema to trace_flow_prod (expand)
        run: ./scripts/deploy-agent-tinybird.sh
        env:
          TB_TARGET_WORKSPACE: trace_flow_prod
          TINYBIRD_DEPLOY_PHASE: expand
          # Last main commit before the clean Tinybird resource cutover. The deploy job fetches full
          # history so expand/switch can restore legacy prod resources after this PR merges.
          TINYBIRD_LEGACY_REF: 11613a4619444adb0e27abc3df958cebb43cc280
          TB_TOKEN: ${{ secrets.TINYBIRD_DEPLOY_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          TB_VERSION_WARNING: 0
          # No Tinybird Local container here; offline `tb build` (dev_mode=local) is the PR-gate's job.
          # `tb --cloud deploy --check` validates against the live workspace before the apply.
          TB_SKIP_BUILD: 1

  deploy-proxy-consumer:
    name: Deploy Proxy Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Proxy Consumer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/proxy-consumer
          command: deploy --env production
          packageManager: bun

  deploy-api:
    name: Deploy API Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production
          packageManager: bun

  # MCP worker verifies access tokens via Convex JWKS, so Convex must deploy first.
  deploy-mcp:
    name: Deploy MCP Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-convex-and-web]
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp
          command: deploy --env production
          packageManager: bun

  # Agent pipeline (TRA-110). Production-real: prod-named workers bound to prod queue/DLQ/KV via the
  # [env.production] blocks, deployed with `--env production`. A guard step asserts the resolved prod
  # config binds no dev resources before either Worker deploys.
  deploy-agent-ingest:
    name: Deploy Agent Ingest Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Ingest Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-ingest
          command: deploy --env production
          packageManager: bun

  deploy-agent-consumer:
    name: Deploy Agent Consumer Worker
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, deploy-tinybird-schema]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert production config binds no dev resources
        run: ./scripts/assert-agent-prod-resources.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Agent Consumer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/agent-consumer
          command: deploy --env production
          packageManager: bun

  deploy-status:
    name: Deployment Status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - deploy-convex-and-web
      - deploy-proxy
      - deploy-tinybird-schema
      - deploy-proxy-consumer
      - deploy-api
      - deploy-mcp
      - deploy-agent-ingest
      - deploy-agent-consumer
    steps:
      - name: Check deployment statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more deployments failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more deployments were cancelled"
            exit 1
          else
            echo "All deployments completed successfully"
          fi
