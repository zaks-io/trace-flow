name: Preview

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Same-repository pull request to deploy
        required: true
        type: number

concurrency:
  group: preview-${{ inputs.pull_request_number }}
  cancel-in-progress: true

env:
  TURBO_LOG_VERBOSITY: 1
  PREVIEW_WEB_URL: https://preview.trace-flow.dev
  PREVIEW_GATEWAY_URL: https://gateway.preview.trace-flow.dev
  PREVIEW_PIPES_API_URL: https://pipes.preview.trace-flow.dev
  PREVIEW_RAW_API_URL: https://raw.preview.trace-flow.dev
  PREVIEW_COLLECTOR_URL: https://collector.preview.trace-flow.dev
  PREVIEW_ANALYST_SANDBOX_URL: https://analyst-sandbox.preview.trace-flow.dev
  PREVIEW_MCP_URL: https://mcp.preview.trace-flow.dev
  PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID: 422b54e456c7446ea5ba4f9ef9a8c84e
  PREVIEW_AGENT_DELIVERY_BUCKET: trace-flow-agent-deliveries-dev

permissions:
  contents: read

jobs:
  prepare:
    name: Authorize Preview
    if: github.actor == 'isuttell' && github.triggering_actor == 'isuttell'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve reviewed pull request
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (pull.state !== 'open') {
              core.setFailed(`Pull request ${pull_number} is not open`);
              return;
            }
            if (pull.head.repo?.full_name !== expectedRepository) {
              core.setFailed('Preview deployments accept same-repository pull requests only');
              return;
            }
            core.setOutput('head_ref', pull.head.ref);
            core.setOutput('head_sha', pull.head.sha);

  deploy-convex:
    name: Deploy Convex Preview
    needs: [prepare]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Preview
    outputs:
      convex_url: ${{ steps.deploy.outputs.convex_url }}
      convex_site_url: ${{ steps.deploy.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify Preview resource isolation
        run: |
          bun -e '
            import agentIngestConfig from "./apps/agent-ingest/wrangler.jsonc";
            const expectedNamespace = process.env.PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID;
            const expectedDeliveryBucket = process.env.PREVIEW_AGENT_DELIVERY_BUCKET;
            if (!expectedNamespace || !expectedDeliveryBucket) throw new Error("Trusted Preview resources are required");

            const findBinding = (items, name) => items?.find((item) => item.binding === name);
            const ingestNamespace = findBinding(agentIngestConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const deliveryBucket = findBinding(agentIngestConfig.env?.preview?.r2_buckets, "AGENT_DELIVERIES")?.bucket_name;

            if (ingestNamespace !== expectedNamespace) throw new Error("Agent Ingest Preview namespace mismatch");
            if (deliveryBucket !== expectedDeliveryBucket) throw new Error("Agent delivery Preview bucket mismatch");
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex Preview
        id: deploy
        run: |
          bunx convex deploy --preview-create "$BRANCH_NAME" \
            --preview-run integrations/splitch:install \
            --cmd 'bash scripts/ci/export-convex-outputs.sh' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          BRANCH_NAME: ${{ needs.prepare.outputs.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure Convex query tracing
        run: |
          test -n "$SENTRY_DSN"
          test -n "$PIPES_API_SHARED_SECRET"
          test -n "$BODY_ACCESS_JWT_SECRET"
          test -n "$AUTH0_DOMAIN"
          test -n "$AUTH0_CLIENT_ID"
          test -n "$TB_TOKEN"
          tinybird_workspace_id=$(node --input-type=module <<'NODE'
          const response = await fetch(new URL("/v1/workspace", process.env.TB_HOST), {
            headers: { Authorization: `Bearer ${process.env.TB_TOKEN}` },
          });
          if (!response.ok) throw new Error(`Tinybird workspace lookup failed: HTTP ${response.status}`);
          const workspace = await response.json();
          if (workspace.name !== "trace_flow_dev" || !/^[0-9a-f-]{36}$/.test(workspace.id ?? "")) {
            throw new Error("Preview requires the trace_flow_dev Tinybird workspace");
          }
          process.stdout.write(workspace.id);
          NODE
          )
          bunx convex env set --preview-name "$BRANCH_NAME" TINYBIRD_WORKSPACE_ID "$tinybird_workspace_id"
          bunx convex env set --preview-name "$BRANCH_NAME" TINYBIRD_API_URL "$TB_HOST"
          printf '%s' "$TB_TOKEN" |
            bunx convex env set --preview-name "$BRANCH_NAME" TINYBIRD_ADMIN_TOKEN
          bunx convex env set --preview-name "$BRANCH_NAME" AUTH0_DOMAIN "$AUTH0_DOMAIN"
          bunx convex env set --preview-name "$BRANCH_NAME" AUTH0_CLIENT_ID "$AUTH0_CLIENT_ID"
          printf '%s' "$SENTRY_DSN" |
            bunx convex env set --preview-name "$BRANCH_NAME" SENTRY_DSN
          printf '%s' "$PIPES_API_SHARED_SECRET" |
            bunx convex env set --preview-name "$BRANCH_NAME" PIPES_API_SHARED_SECRET
          printf '%s' "$BODY_ACCESS_JWT_SECRET" |
            bunx convex env set --preview-name "$BRANCH_NAME" BODY_ACCESS_JWT_SECRET
          bunx convex env set --preview-name "$BRANCH_NAME" SENTRY_ENVIRONMENT preview
          bunx convex env set --preview-name "$BRANCH_NAME" AGENT_INGEST_URL "$PREVIEW_COLLECTOR_URL"
          bunx convex env set --preview-name "$BRANCH_NAME" ANALYST_SANDBOX_URL "$PREVIEW_ANALYST_SANDBOX_URL"
          bunx convex env set --preview-name "$BRANCH_NAME" APP_URL "$PREVIEW_WEB_URL"
          # Auth configuration is evaluated when the deployment is pushed.
          bunx convex deploy --preview-name "$BRANCH_NAME"
        env:
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          PIPES_API_SHARED_SECRET: ${{ secrets.PIPES_API_SHARED_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}
          AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          TB_TOKEN: ${{ secrets.TINYBIRD_DEV_TOKEN_MANAGER_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          BRANCH_NAME: ${{ needs.prepare.outputs.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  preview:
    name: Deploy Preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [prepare, deploy-convex]
    environment: Preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify Preview resource isolation
        run: |
          bun -e '
            import agentIngestConfig from "./apps/agent-ingest/wrangler.jsonc";
            const expectedNamespace = process.env.PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID;
            const expectedDeliveryBucket = process.env.PREVIEW_AGENT_DELIVERY_BUCKET;
            if (!expectedNamespace || !expectedDeliveryBucket) throw new Error("Trusted Preview resources are required");

            const findBinding = (items, name) => items?.find((item) => item.binding === name);
            const ingestNamespace = findBinding(agentIngestConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const deliveryBucket = findBinding(agentIngestConfig.env?.preview?.r2_buckets, "AGENT_DELIVERIES")?.bucket_name;

            if (ingestNamespace !== expectedNamespace) throw new Error("Agent Ingest Preview namespace mismatch");
            if (deliveryBucket !== expectedDeliveryBucket) throw new Error("Agent delivery Preview bucket mismatch");
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure R2 retention
        run: |
          node --test scripts/ci/body-retention.test.mjs
          bun scripts/ci/provision-agent-delivery.mjs dev
          bun scripts/setup-r2-lifecycle.ts \
            trace-flow-storage-dev \
            trace-flow-agent-deliveries-dev \
            trace-flow-analyst-sandbox-backups-dev \
            trace-flow-analyst-sandbox-backups-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Static Preview Workers
        run: |
          for attempt in 1 2 3; do
            if bunx turbo run deploy:preview \
              --filter='./apps/*' \
              --filter='!@trace-flow/web' \
              --filter='!@trace-flow/proxy' \
              --filter='!@trace-flow/mcp' \
              --filter='!@trace-flow/agent-ingest' \
              --filter='!@trace-flow/agent-consumer' \
              --filter='!@trace-flow/analyst-sandbox' \
              --filter='!@trace-flow/pipes-api' \
              --filter='!@trace-flow/api' \
              --env-mode=loose \
              --concurrency=1; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 20))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Pipes API query tracing
        working-directory: apps/pipes-api
        run: |
          test -n "$SENTRY_DSN"
          printf '%s' "$SENTRY_DSN" | bunx wrangler secret put SENTRY_DSN --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deploy Convex-backed Preview Workers
        run: |
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          umask 077
          pipes_secrets_file="$secrets_directory/pipes-api.env"
          api_secrets_file="$secrets_directory/api.env"
          agent_consumer_secrets_file="$secrets_directory/agent-consumer.env"
          agent_ingest_secrets_file="$secrets_directory/agent-ingest.env"
          test -n "$PIPES_API_SHARED_SECRET"
          test -n "$BODY_ACCESS_JWT_SECRET"
          test -n "$AGENT_DELIVERY_ENCRYPTION_ROOT_KEY"
          test -n "$TB_TOKEN"
          printf 'PIPES_API_SHARED_SECRET=%s\n' "$PIPES_API_SHARED_SECRET" > "$pipes_secrets_file"
          printf 'BODY_ACCESS_JWT_SECRET=%s\n' "$BODY_ACCESS_JWT_SECRET" > "$api_secrets_file"
          bun scripts/ci/configure-agent-tinybird-tokens.mjs "$agent_consumer_secrets_file"
          unset TB_TOKEN
          printf 'BODY_ENCRYPTION_ROOT_KEY=%s\n' "$AGENT_DELIVERY_ENCRYPTION_ROOT_KEY" >> "$agent_consumer_secrets_file"
          printf 'BODY_ENCRYPTION_ROOT_KEY=%s\n' "$AGENT_DELIVERY_ENCRYPTION_ROOT_KEY" > "$agent_ingest_secrets_file"
          for attempt in 1 2 3; do
            if (
              cd apps/proxy && bunx wrangler deploy --env preview --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/mcp && bunx wrangler deploy --env preview
            ) && (
              cd apps/agent-consumer && bunx wrangler deploy --secrets-file "$agent_consumer_secrets_file"
            ) && (
              cd apps/agent-ingest && bunx wrangler deploy --env preview \
                --secrets-file "$agent_ingest_secrets_file" \
                --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/api && bunx wrangler deploy --env preview \
                --secrets-file "$api_secrets_file" \
                --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/pipes-api && bunx wrangler deploy --env preview \
                --secrets-file "$pipes_secrets_file" \
                --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/analyst-sandbox && bunx wrangler deploy --env preview --var CONVEX_URL:"$CONVEX_URL"
            ); then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 20))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIPES_API_SHARED_SECRET: ${{ secrets.PIPES_API_SHARED_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}
          AGENT_DELIVERY_ENCRYPTION_ROOT_KEY: ${{ secrets.AGENT_DELIVERY_ENCRYPTION_ROOT_KEY }}
          TB_TOKEN: ${{ secrets.TINYBIRD_DEV_TOKEN_MANAGER_TOKEN }}
          TB_HOST: https://api.us-west-2.aws.tinybird.co
          CONVEX_URL: ${{ needs.deploy-convex.outputs.convex_url }}
          CONVEX_SITE_URL: ${{ needs.deploy-convex.outputs.convex_site_url }}

      # The proxy refuses every request with 503 when its secrets fail startup validation.
      # A bad BODY_ENCRYPTION_ROOT_KEY otherwise only surfaces as truncated response bodies.
      # Custom Domain DNS and certificates can take a few minutes on the first deployment.
      - name: Verify Proxy Preview health
        run: curl --fail --silent --show-error --retry-all-errors --retry 20 --retry-delay 15 --retry-max-time 300 --connect-timeout 10 --max-time 30 "$PREVIEW_GATEWAY_URL/healthz"

      - name: Build Web Preview
        run: bunx turbo run build --filter=@trace-flow/web && cd apps/web && bunx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.deploy-convex.outputs.convex_url }}
          NEXT_PUBLIC_API_URL: ${{ env.PREVIEW_RAW_API_URL }}
          NEXT_PUBLIC_PIPES_API_URL: ${{ env.PREVIEW_PIPES_API_URL }}
          NEXT_PUBLIC_RAW_API_URL: ${{ env.PREVIEW_RAW_API_URL }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}
          APP_BASE_URL: ${{ env.PREVIEW_WEB_URL }}
          NEXT_PUBLIC_DEPLOY_ID: ${{ needs.prepare.outputs.head_sha }}

      - name: Configure Web Preview authentication
        working-directory: apps/web
        run: |
          web_secrets_file=$(mktemp)
          trap 'rm -f "$web_secrets_file"' EXIT
          bun -e '
            const names = ["AUTH0_DOMAIN", "AUTH0_CLIENT_ID", "AUTH0_CLIENT_SECRET", "AUTH0_SECRET", "BODY_ACCESS_JWT_SECRET"];
            const values = Object.fromEntries(names.map((name) => {
              const value = process.env[name];
              if (!value) throw new Error(name + " is required");
              return [name, value];
            }));
            await Bun.write(process.argv[1], JSON.stringify(values));
          ' "$web_secrets_file"
          bunx wrangler secret bulk "$web_secrets_file" --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}

      # Deploy web to Workers preview
      - name: Deploy Web Preview
        run: cd apps/web && bunx opennextjs-cloudflare deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Comment Preview URLs
    needs: [prepare, preview]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- trace-flow-preview-comment -->';
            const body = `${marker}
            ## Preview Deployed

            | Service | URL |
            |---------|-----|
            | Web | ${process.env.PREVIEW_WEB_URL} |
            | Pipes API | ${process.env.PREVIEW_PIPES_API_URL} |
            | Raw API | ${process.env.PREVIEW_RAW_API_URL} |
            | Proxy | ${process.env.PREVIEW_GATEWAY_URL} |
            | Agent Ingest | ${process.env.PREVIEW_COLLECTOR_URL} |
            | Analyst Sandbox | ${process.env.PREVIEW_ANALYST_SANDBOX_URL} |
            | MCP | ${process.env.PREVIEW_MCP_URL} |
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER)
            });

            const botComment = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('Preview Deployed'))
            );

            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
              });
            } catch (error) {
              core.warning(`Unable to write preview comment: ${error.message}`);
            }
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
