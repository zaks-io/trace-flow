name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deploy workers to preview environment
      - name: Deploy Preview Workers
        run: pnpm turbo run deploy:preview --filter='./workers/*' --filter='!@observe/web' --env-mode=loose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Convex preview and build web
      - name: Deploy Convex Preview and Build Web
        run: |
          npx convex deploy --preview-create "$BRANCH_NAME" \
            --cmd 'pnpm turbo run build --filter=@observe/web' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_API_URL: https://observe-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}

      # Deploy web to Pages preview
      - name: Deploy Web Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/web
          command: pages deploy ./out --project-name=observe-web --branch="${{ github.head_ref }}"
          packageManager: pnpm

      # Post/update comment with preview URLs
      - name: Comment PR
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const body = `## 🚀 Preview Deployed

            | Service | URL |
            |---------|-----|
            | Web | https://${branchName}.observe-web.pages.dev |
            | API | https://observe-api-preview.isaac-a46.workers.dev |
            | Proxy | https://observe-proxy-preview.isaac-a46.workers.dev |
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes('🚀 Preview Deployed'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
