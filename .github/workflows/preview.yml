name: Preview

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Same-repository pull request to deploy
        required: true
        type: number

concurrency:
  group: preview-${{ inputs.pull_request_number }}
  cancel-in-progress: true

env:
  TURBO_LOG_VERBOSITY: 1
  PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID: 422b54e456c7446ea5ba4f9ef9a8c84e
  PREVIEW_ARCHIVE_BUCKET: trace-flow-agent-archive-preview

permissions:
  contents: read

jobs:
  prepare:
    name: Authorize Preview
    if: github.actor == 'isuttell' && github.triggering_actor == 'isuttell'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve reviewed pull request
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (pull.state !== 'open') {
              core.setFailed(`Pull request ${pull_number} is not open`);
              return;
            }
            if (pull.head.repo?.full_name !== expectedRepository) {
              core.setFailed('Preview deployments accept same-repository pull requests only');
              return;
            }
            core.setOutput('head_ref', pull.head.ref);
            core.setOutput('head_sha', pull.head.sha);

  deploy-convex:
    name: Deploy Convex Preview
    needs: [prepare]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Preview
    outputs:
      convex_url: ${{ steps.deploy.outputs.convex_url }}
      convex_site_url: ${{ steps.deploy.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify Preview resource isolation
        run: |
          bun -e '
            import agentIngestConfig from "./apps/agent-ingest/wrangler.jsonc";
            import archiveApiConfig from "./apps/archive-api/wrangler.jsonc";

            const expectedNamespace = process.env.PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID;
            const expectedBucket = process.env.PREVIEW_ARCHIVE_BUCKET;
            if (!expectedNamespace || !expectedBucket) throw new Error("Trusted Preview resources are required");

            const findBinding = (items, name) => items?.find((item) => item.binding === name);
            const ingestNamespace = findBinding(agentIngestConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const archiveNamespace = findBinding(archiveApiConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const archiveBucket = findBinding(archiveApiConfig.env?.preview?.r2_buckets, "ARCHIVE_STORAGE")?.bucket_name;

            if (ingestNamespace !== expectedNamespace) throw new Error("Agent Ingest Preview namespace mismatch");
            if (archiveNamespace !== expectedNamespace) throw new Error("Archive API Preview namespace mismatch");
            if (archiveBucket !== expectedBucket) throw new Error("Archive API Preview bucket mismatch");
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex Preview
        id: deploy
        run: |
          bunx convex deploy --preview-create "$BRANCH_NAME" \
            --preview-run integrations/splitch:install \
            --cmd 'bash scripts/ci/export-convex-outputs.sh' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          BRANCH_NAME: ${{ needs.prepare.outputs.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure Archive API authorization
        run: |
          test -n "$ARCHIVE_API_SHARED_SECRET"
          printf '%s' "$ARCHIVE_API_SHARED_SECRET" |
            bunx convex env set --preview-name "$BRANCH_NAME" ARCHIVE_API_SHARED_SECRET
          bunx convex env set --preview-name "$BRANCH_NAME" \
            CLOUDFLARE_COLLECTOR_CREDS_NAMESPACE_ID "$PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID"
          bunx convex env set --preview-name "$BRANCH_NAME" CONVERSATION_ARCHIVE_ENABLED true
        env:
          ARCHIVE_API_SHARED_SECRET: ${{ secrets.ARCHIVE_API_SHARED_SECRET }}
          BRANCH_NAME: ${{ needs.prepare.outputs.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  preview:
    name: Deploy Preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [prepare, deploy-convex]
    environment: Preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Verify Preview resource isolation
        run: |
          bun -e '
            import agentIngestConfig from "./apps/agent-ingest/wrangler.jsonc";
            import archiveApiConfig from "./apps/archive-api/wrangler.jsonc";

            const expectedNamespace = process.env.PREVIEW_COLLECTOR_CREDS_NAMESPACE_ID;
            const expectedBucket = process.env.PREVIEW_ARCHIVE_BUCKET;
            if (!expectedNamespace || !expectedBucket) throw new Error("Trusted Preview resources are required");

            const findBinding = (items, name) => items?.find((item) => item.binding === name);
            const ingestNamespace = findBinding(agentIngestConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const archiveNamespace = findBinding(archiveApiConfig.env?.preview?.kv_namespaces, "COLLECTOR_CREDS")?.id;
            const archiveBucket = findBinding(archiveApiConfig.env?.preview?.r2_buckets, "ARCHIVE_STORAGE")?.bucket_name;

            if (ingestNamespace !== expectedNamespace) throw new Error("Agent Ingest Preview namespace mismatch");
            if (archiveNamespace !== expectedNamespace) throw new Error("Archive API Preview namespace mismatch");
            if (archiveBucket !== expectedBucket) throw new Error("Archive API Preview bucket mismatch");
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Protect pending trace deliveries from body expiration
        run: |
          node --test scripts/ci/body-retention.test.mjs
          bun scripts/setup-r2-lifecycle.ts trace-flow-storage-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Static Preview Workers
        run: |
          for attempt in 1 2 3; do
            if bunx turbo run deploy:preview \
              --filter='./apps/*' \
              --filter='!@trace-flow/web' \
              --filter='!@trace-flow/proxy' \
              --filter='!@trace-flow/mcp' \
              --filter='!@trace-flow/agent-ingest' \
              --filter='!@trace-flow/archive-api' \
              --filter='!@trace-flow/analyst-sandbox' \
              --env-mode=loose \
              --concurrency=1; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 20))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex-backed Preview Workers
        run: |
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          umask 077
          secrets_file="$secrets_directory/archive-api.env"
          test -n "$ARCHIVE_API_SHARED_SECRET"
          test -n "$ARCHIVE_KEY_WRAPPING_SECRET"
          {
            printf 'ARCHIVE_API_SHARED_SECRET=%s\n' "$ARCHIVE_API_SHARED_SECRET"
            printf 'ARCHIVE_KEY_WRAPPING_SECRET=%s\n' "$ARCHIVE_KEY_WRAPPING_SECRET"
          } > "$secrets_file"
          for attempt in 1 2 3; do
            if (
              cd apps/proxy && bunx wrangler deploy --env preview --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/mcp && bunx wrangler deploy --env preview
            ) && (
              cd apps/agent-ingest && bunx wrangler deploy --env preview --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/archive-api && bunx wrangler deploy --env preview \
                --secrets-file "$secrets_file" \
                --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
            ) && (
              cd apps/analyst-sandbox && bunx wrangler deploy --env preview --var CONVEX_URL:"$CONVEX_URL"
            ); then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 20))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_API_SHARED_SECRET: ${{ secrets.ARCHIVE_API_SHARED_SECRET }}
          ARCHIVE_KEY_WRAPPING_SECRET: ${{ secrets.ARCHIVE_KEY_WRAPPING_SECRET }}
          CONVEX_URL: ${{ needs.deploy-convex.outputs.convex_url }}
          CONVEX_SITE_URL: ${{ needs.deploy-convex.outputs.convex_site_url }}

      - name: Build Web Preview
        run: bunx turbo run build --filter=@trace-flow/web && cd apps/web && bunx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ needs.deploy-convex.outputs.convex_url }}
          NEXT_PUBLIC_API_URL: https://trace-flow-raw-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_PIPES_API_URL: https://trace-flow-pipes-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_RAW_API_URL: https://trace-flow-raw-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          BODY_ACCESS_JWT_SECRET: ${{ secrets.BODY_ACCESS_JWT_SECRET }}
          APP_BASE_URL: https://trace-flow-web-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_DEPLOY_ID: ${{ needs.prepare.outputs.head_sha }}

      # Deploy web to Workers preview
      - name: Deploy Web Preview
        run: cd apps/web && bunx opennextjs-cloudflare deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Comment Preview URLs
    needs: [prepare, preview]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- trace-flow-preview-comment -->';
            const body = `${marker}
            ## Preview Deployed

            | Service | URL |
            |---------|-----|
            | Web | https://trace-flow-web-preview.isaac-a46.workers.dev |
            | Pipes API | https://trace-flow-pipes-api-preview.isaac-a46.workers.dev |
            | Raw API | https://trace-flow-raw-api-preview.isaac-a46.workers.dev |
            | Proxy | https://trace-flow-proxy-preview.isaac-a46.workers.dev |
            | Agent Ingest | https://trace-flow-agent-ingest-preview.isaac-a46.workers.dev |
            | Archive API | https://trace-flow-archive-api-preview.isaac-a46.workers.dev |
            | Analyst Sandbox | https://trace-flow-analyst-sandbox-preview.isaac-a46.workers.dev |
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER)
            });

            const botComment = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('Preview Deployed'))
            );

            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
              });
            } catch (error) {
              core.warning(`Unable to write preview comment: ${error.message}`);
            }
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
