name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TURBO_LOG_VERBOSITY: 1

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deploy workers to preview environment
      - name: Deploy Preview Workers
        run: |
          for attempt in 1 2 3; do
            if bunx turbo run deploy:preview --filter='./apps/*' --filter='!@trace-flow/web' --env-mode=loose --concurrency=1; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep $((attempt * 20))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Convex preview and build web
      - name: Deploy Convex Preview and Build Web
        run: |
          npx convex deploy --preview-create "$BRANCH_NAME" \
            --cmd 'bunx turbo run build --filter=@trace-flow/web && cd apps/web && bunx opennextjs-cloudflare build' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_API_URL: https://trace-flow-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID: ${{ vars.NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          APP_BASE_URL: https://trace-flow-web-dev.isaac-a46.workers.dev
          NEXT_PUBLIC_DEPLOY_ID: ${{ github.sha }}

      # Deploy web to Workers preview
      - name: Deploy Web Preview
        run: cd apps/web && bunx opennextjs-cloudflare deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post/update comment with preview URLs
      - name: Comment PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- trace-flow-preview-comment -->';
            const body = `${marker}
            ## 🚀 Preview Deployed

            | Service | URL |
            |---------|-----|
            | Web | https://trace-flow-web-dev.isaac-a46.workers.dev |
            | API | https://trace-flow-api-preview.isaac-a46.workers.dev |
            | Proxy | https://trace-flow-proxy-preview.isaac-a46.workers.dev |
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('🚀 Preview Deployed'))
            );

            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            } catch (error) {
              core.warning(`Unable to write preview comment: ${error.message}`);
            }
