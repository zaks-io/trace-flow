name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deploy workers to preview environment
      - name: Deploy Preview Workers
        run: bunx turbo run deploy:preview --filter='./workers/*' --filter='!@trace-flow/web' --env-mode=loose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Convex preview and build web
      - name: Deploy Convex Preview and Build Web
        run: |
          npx convex deploy --preview-create "$BRANCH_NAME" \
            --cmd 'bunx turbo run build --filter=@trace-flow/web && cd workers/web && bunx opennextjs-cloudflare build' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_API_URL: https://trace-flow-api-preview.isaac-a46.workers.dev
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_TINYBIRD_API_URL: ${{ vars.NEXT_PUBLIC_TINYBIRD_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID: ${{ vars.NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_SIDE_ID }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          APP_BASE_URL: https://trace-flow-web-dev.isaac-a46.workers.dev
          NEXT_PUBLIC_DEPLOY_ID: ${{ github.sha }}

      # Deploy web to Workers preview
      - name: Deploy Web Preview
        run: cd workers/web && bunx opennextjs-cloudflare deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post/update comment with preview URLs
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚀 Preview Deployed

            | Service | URL |
            |---------|-----|
            | Web | https://trace-flow-web-dev.isaac-a46.workers.dev |
            | API | https://trace-flow-api-preview.isaac-a46.workers.dev |
            | Proxy | https://trace-flow-proxy-preview.isaac-a46.workers.dev |
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes('🚀 Preview Deployed'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
