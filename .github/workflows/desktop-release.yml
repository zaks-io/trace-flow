name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'bun.lock'
      - 'packages/collector-*/**'
      - 'apps/desktop/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        default: both
        options:
          - both
          - macos
          - windows
      release_notes:
        description: Release notes shown in the updater manifest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

env:
  R2_BUCKET: static
  RUST_BACKTRACE: 1
  UPDATE_ROOT: https://downloads.zaks.sh/trace-flow/desktop

jobs:
  setup:
    name: Resolve matrix
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      platform: ${{ steps.platform.outputs.platform }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: platform
        env:
          PLATFORM: ${{ inputs.platform || 'both' }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            both|macos|windows) echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unsupported desktop platform: $PLATFORM"
              exit 1
              ;;
          esac

      - id: matrix
        env:
          PLATFORM: ${{ steps.platform.outputs.platform }}
        run: |
          set -euo pipefail
          macos='{"name":"macos","runner":"blacksmith-6vcpu-macos-latest","target":"aarch64-apple-darwin"}'
          windows='{"name":"windows","runner":"blacksmith-4vcpu-windows-2025","target":"x86_64-pc-windows-msvc"}'
          case "$PLATFORM" in
            macos) include="[$macos]" ;;
            windows) include="[$windows]" ;;
            *) include="[$macos,$windows]" ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"

      - id: version
        name: Resolve desktop release version
        run: |
          set -euo pipefail
          base_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::desktop version must be plain major.minor.patch semver, got: $base_version"
            exit 1
          fi

          build_number="$GITHUB_RUN_NUMBER"
          if [ "$build_number" -gt 65535 ]; then
            echo "::error::GitHub run number $build_number exceeds the Windows patch version limit"
            exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${build_number}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved desktop release version $version."

  build:
    name: Build (${{ matrix.name }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.include) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Import Apple Developer certificate
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is required}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Write Apple notarization key
        if: matrix.name == 'macos'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is required}"
          : "${APPLE_API_KEY_BASE64:?APPLE_API_KEY_BASE64 is required}"
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Write release Tauri config
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.setup.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_UPDATER_PUBLIC_KEY:-}" ]; then
            echo "::error::TAURI_UPDATER_PUBLIC_KEY is required to generate updater artifacts"
            exit 1
          fi
          # shellcheck disable=SC2016
          bun -e '
            import fs from "node:fs";

            const configPath = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.version = process.env.DESKTOP_VERSION;
            config.bundle = {
              ...(config.bundle ?? {}),
              targets: "all",
              createUpdaterArtifacts: true,
            };
            config.plugins = {
              ...(config.plugins ?? {}),
              updater: {
                endpoints: [`${process.env.UPDATE_ROOT}/latest.json`],
                pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY,
                windows: { installMode: "passive" },
              },
            };
            fs.writeFileSync(
              "apps/desktop/src-tauri/tauri.release.conf.json",
              `${JSON.stringify(config, null, 2)}\n`,
            );
          '

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Upload artifacts (macOS)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceflow-desktop-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceflow-desktop-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to R2
    needs: [setup, build]
    if: needs.setup.outputs.platform == 'both' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    environment: Production
    env:
      RELEASE_NOTES: ${{ inputs.release_notes }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traceflow-desktop-macos-arm64
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traceflow-desktop-windows-x64
          path: artifacts/windows

      - name: Resolve artifacts
        id: meta
        run: |
          set -euo pipefail
          DMG_FILE=$(find artifacts/macos -name '*.dmg' | head -1)
          DARWIN_BUNDLE=$(find artifacts/macos -name '*.app.tar.gz' | head -1)
          WIN_BUNDLE=$(find artifacts/windows -name '*-setup.exe' | head -1)
          if [ -z "$WIN_BUNDLE" ]; then
            WIN_BUNDLE=$(find artifacts/windows -name '*.exe' | head -1)
          fi
          MSI_FILE=$(find artifacts/windows -name '*.msi' | head -1)
          for kv in "macOS DMG:$DMG_FILE" "macOS bundle:$DARWIN_BUNDLE" "macOS bundle signature:${DARWIN_BUNDLE}.sig" "Windows installer:$WIN_BUNDLE" "Windows installer signature:${WIN_BUNDLE}.sig" "Windows MSI:$MSI_FILE"; do
            label="${kv%%:*}"
            path="${kv#*:}"
            if [ -z "$path" ] || [ ! -s "$path" ]; then
              echo "::error::missing artifact: ${label} (${path:-<not found>})"
              exit 1
            fi
          done
          {
            echo "dmg_file=$DMG_FILE"
            echo "darwin_bundle=$DARWIN_BUNDLE"
            echo "darwin_name=trace-flow-desktop-macos-arm64.app.tar.gz"
            echo "windows_bundle=$WIN_BUNDLE"
            echo "windows_name=trace-flow-desktop-windows-x64-setup.exe"
            echo "msi_file=$MSI_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate desktop release version
        run: |
          set -euo pipefail
          manifest_file=$(mktemp)
          trap 'rm -f "$manifest_file"' EXIT

          http_code=$(curl -sS -L \
            -w '%{http_code}' \
            -o "$manifest_file" \
            "${UPDATE_ROOT}/latest.json?run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}")

          if [ "$http_code" = "404" ]; then
            echo "No published desktop manifest found; allowing the first release."
            exit 0
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::failed to fetch the published desktop manifest; HTTP $http_code"
            exit 1
          fi

          remote_version=$(jq -er '.version' "$manifest_file")
          highest=$(printf '%s\n%s\n' "$remote_version" "$VERSION" | sort -V | tail -n1)
          if [ "$VERSION" = "$remote_version" ] || [ "$highest" != "$VERSION" ]; then
            echo "::error::desktop version $VERSION must be newer than published version $remote_version"
            exit 1
          fi
          echo "Desktop release version $VERSION is newer than $remote_version."

      - name: Upload versioned artifacts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          DARWIN_BUNDLE: ${{ steps.meta.outputs.darwin_bundle }}
          MSI_FILE: ${{ steps.meta.outputs.msi_file }}
          WIN_BUNDLE: ${{ steps.meta.outputs.windows_bundle }}
        run: |
          set -euo pipefail
          destination="${R2_BUCKET}/trace-flow/desktop/${VERSION}"
          upload() {
            local source=$1
            local name=$2
            local content_type=$3
            bunx wrangler@4.95.0 r2 object put \
              "${destination}/${name}" \
              --remote \
              --file "$source" \
              --content-type "$content_type" \
              --cache-control 'public, max-age=31536000, immutable' \
              --force
          }
          upload "$DMG_FILE" trace-flow-desktop-macos-arm64.dmg application/x-apple-diskimage
          upload "$DARWIN_BUNDLE" trace-flow-desktop-macos-arm64.app.tar.gz application/gzip
          upload "${DARWIN_BUNDLE}.sig" trace-flow-desktop-macos-arm64.app.tar.gz.sig text/plain
          upload "$WIN_BUNDLE" trace-flow-desktop-windows-x64-setup.exe application/vnd.microsoft.portable-executable
          upload "${WIN_BUNDLE}.sig" trace-flow-desktop-windows-x64-setup.exe.sig text/plain
          upload "$MSI_FILE" trace-flow-desktop-windows-x64.msi application/x-msi

      - name: Publish latest installers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          WIN_BUNDLE: ${{ steps.meta.outputs.windows_bundle }}
        run: |
          set -euo pipefail
          bunx wrangler@4.95.0 r2 object put \
            "${R2_BUCKET}/trace-flow/desktop/latest/trace-flow-desktop.dmg" \
            --remote \
            --file "$DMG_FILE" \
            --content-type application/x-apple-diskimage \
            --cache-control 'no-cache, max-age=0' \
            --force
          bunx wrangler@4.95.0 r2 object put \
            "${R2_BUCKET}/trace-flow/desktop/latest/trace-flow-desktop-setup.exe" \
            --remote \
            --file "$WIN_BUNDLE" \
            --content-type application/vnd.microsoft.portable-executable \
            --cache-control 'no-cache, max-age=0' \
            --force

      - name: Build desktop updater manifest
        env:
          DARWIN_NAME: ${{ steps.meta.outputs.darwin_name }}
          WINDOWS_NAME: ${{ steps.meta.outputs.windows_name }}
          DARWIN_BUNDLE: ${{ steps.meta.outputs.darwin_bundle }}
          WINDOWS_BUNDLE: ${{ steps.meta.outputs.windows_bundle }}
        run: |
          set -euo pipefail
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes="Trace Flow Desktop ${VERSION}"
          fi
          DARWIN_SIG=$(cat "${DARWIN_BUNDLE}.sig")
          WIN_SIG=$(cat "${WINDOWS_BUNDLE}.sig")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="${UPDATE_ROOT}/${VERSION}"
          jq -n \
            --arg v "$VERSION" \
            --arg notes "$notes" \
            --arg date "$PUB_DATE" \
            --arg darwin_url "${base_url}/${DARWIN_NAME}" \
            --arg darwin_sig "$DARWIN_SIG" \
            --arg win_url "${base_url}/${WINDOWS_NAME}" \
            --arg win_sig "$WIN_SIG" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{
              "darwin-aarch64":{signature:$darwin_sig, url:$darwin_url},
              "windows-x86_64":{signature:$win_sig, url:$win_url}
          }}' > latest.json
          jq . latest.json

      - name: Publish updater manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.95.0 r2 object put \
            "${R2_BUCKET}/trace-flow/desktop/latest.json" \
            --remote \
            --file latest.json \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0' \
            --force

      - name: Verify public update channel
        run: |
          set -euo pipefail
          manifest_file=$(mktemp)
          trap 'rm -f "$manifest_file"' EXIT
          curl -fsSL \
            "${UPDATE_ROOT}/latest.json?run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            -o "$manifest_file"
          jq -e --arg version "$VERSION" '
            .version == $version and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            (.platforms["windows-x86_64"].signature | length > 0)
          ' "$manifest_file" >/dev/null
          jq -r '.platforms[].url' "$manifest_file" | while IFS= read -r url; do
            curl -fsSIL "$url" >/dev/null
          done
          echo "Published and verified Trace Flow Desktop ${VERSION}."
