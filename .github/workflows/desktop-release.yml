name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        default: both
        options:
          - both
          - macos
          - windows
      tag:
        description: GitHub release tag (default traceflow-desktop-v{version})
        type: string
        default: ''
      release_notes:
        description: Release notes shown in the updater manifest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.platform }}
  cancel-in-progress: false

env:
  GH_RELEASE_LATEST_URL: https://github.com/zaks-io/trace-flow/releases/latest/download/traceflow-desktop-latest.json
  RUST_BACKTRACE: 1

jobs:
  setup:
    name: Resolve matrix
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      tag: ${{ steps.matrix.outputs.tag }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - id: matrix
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          tag="${INPUT_TAG:-traceflow-desktop-v${version}}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9A-Za-z._/-]+$'; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" --jq '.[].ref' | grep -Fx "refs/tags/$tag" >/dev/null; then
            echo "::error::Release tag $tag does not exist. Create and push the tag before running this workflow."
            exit 1
          fi
          macos='{"name":"macos","runner":"blacksmith-6vcpu-macos-latest","target":"aarch64-apple-darwin"}'
          windows='{"name":"windows","runner":"blacksmith-4vcpu-windows-2025","target":"x86_64-pc-windows-msvc"}'
          case "$PLATFORM" in
            macos) include="[$macos]" ;;
            windows) include="[$windows]" ;;
            *) include="[$macos,$windows]" ;;
          esac
          {
            echo "include=$include"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.include) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Import Apple Developer certificate
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is required}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Write Apple notarization key
        if: matrix.name == 'macos'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is required}"
          : "${APPLE_API_KEY_BASE64:?APPLE_API_KEY_BASE64 is required}"
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Write release Tauri config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_UPDATER_PUBLIC_KEY:-}" ]; then
            echo "::error::TAURI_UPDATER_PUBLIC_KEY is required to generate updater artifacts"
            exit 1
          fi
          # shellcheck disable=SC2016
          bun -e '
            import fs from "node:fs";

            const configPath = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.bundle = {
              ...(config.bundle ?? {}),
              targets: "all",
              createUpdaterArtifacts: true,
            };
            config.plugins = {
              ...(config.plugins ?? {}),
              updater: {
                endpoints: [process.env.GH_RELEASE_LATEST_URL],
                pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY,
                windows: { installMode: "passive" },
              },
            };
            fs.writeFileSync(
              "apps/desktop/src-tauri/tauri.release.conf.json",
              `${JSON.stringify(config, null, 2)}\n`,
            );
          '

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Upload artifacts (macOS)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traceflow-desktop-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traceflow-desktop-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [setup, build]
    if: inputs.platform == 'both'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: traceflow-desktop-macos-arm64
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: traceflow-desktop-windows-x64
          path: artifacts/windows

      - name: Resolve artifacts
        id: meta
        run: |
          set -euo pipefail
          DMG_FILE=$(find artifacts/macos -name '*.dmg' | head -1)
          DARWIN_BUNDLE=$(find artifacts/macos -name '*.app.tar.gz' | head -1)
          WIN_BUNDLE=$(find artifacts/windows -name '*-setup.exe' | head -1)
          if [ -z "$WIN_BUNDLE" ]; then
            WIN_BUNDLE=$(find artifacts/windows -name '*.exe' | head -1)
          fi
          MSI_FILE=$(find artifacts/windows -name '*.msi' | head -1)
          for kv in "macOS DMG:$DMG_FILE" "macOS bundle:$DARWIN_BUNDLE" "macOS bundle signature:${DARWIN_BUNDLE}.sig" "Windows installer:$WIN_BUNDLE" "Windows installer signature:${WIN_BUNDLE}.sig" "Windows MSI:$MSI_FILE"; do
            label="${kv%%:*}"
            path="${kv#*:}"
            if [ -z "$path" ] || [ ! -s "$path" ]; then
              echo "::error::missing artifact: ${label} (${path:-<not found>})"
              exit 1
            fi
          done
          mkdir -p release-assets
          cp "$DMG_FILE" release-assets/traceflow-desktop-macos-arm64.dmg
          cp "$DARWIN_BUNDLE" release-assets/traceflow-desktop-macos-arm64.app.tar.gz
          cp "${DARWIN_BUNDLE}.sig" release-assets/traceflow-desktop-macos-arm64.app.tar.gz.sig
          cp "$WIN_BUNDLE" release-assets/traceflow-desktop-windows-x64-setup.exe
          cp "${WIN_BUNDLE}.sig" release-assets/traceflow-desktop-windows-x64-setup.exe.sig
          cp "$MSI_FILE" release-assets/traceflow-desktop-windows-x64.msi
          {
            echo "dmg_file=release-assets/traceflow-desktop-macos-arm64.dmg"
            echo "darwin_bundle=release-assets/traceflow-desktop-macos-arm64.app.tar.gz"
            echo "darwin_name=traceflow-desktop-macos-arm64.app.tar.gz"
            echo "windows_bundle=release-assets/traceflow-desktop-windows-x64-setup.exe"
            echo "windows_name=traceflow-desktop-windows-x64-setup.exe"
            echo "msi_file=release-assets/traceflow-desktop-windows-x64.msi"
          } >> "$GITHUB_OUTPUT"

      - name: Build desktop updater manifest
        env:
          DARWIN_NAME: ${{ steps.meta.outputs.darwin_name }}
          WINDOWS_NAME: ${{ steps.meta.outputs.windows_name }}
          DARWIN_BUNDLE: ${{ steps.meta.outputs.darwin_bundle }}
          WINDOWS_BUNDLE: ${{ steps.meta.outputs.windows_bundle }}
        run: |
          set -euo pipefail
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes="Trace Flow Desktop ${VERSION}"
          fi
          DARWIN_SIG=$(cat "${DARWIN_BUNDLE}.sig")
          WIN_SIG=$(cat "${WINDOWS_BUNDLE}.sig")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n \
            --arg v "$VERSION" \
            --arg notes "$notes" \
            --arg date "$PUB_DATE" \
            --arg darwin_url "${base_url}/${DARWIN_NAME}" \
            --arg darwin_sig "$DARWIN_SIG" \
            --arg win_url "${base_url}/${WINDOWS_NAME}" \
            --arg win_sig "$WIN_SIG" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{
              "darwin-aarch64":{signature:$darwin_sig, url:$darwin_url},
              "windows-x86_64":{signature:$win_sig, url:$win_url}
            }}' > traceflow-desktop-latest.json
          jq . traceflow-desktop-latest.json

      - name: Create GitHub Release
        env:
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          DARWIN_BUNDLE: ${{ steps.meta.outputs.darwin_bundle }}
          MSI_FILE: ${{ steps.meta.outputs.msi_file }}
          WIN_BUNDLE: ${{ steps.meta.outputs.windows_bundle }}
        run: |
          set -euo pipefail
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes="Trace Flow Desktop ${VERSION}"
          fi
          printf '%s\n' "$notes" > release-notes.txt
          title="Trace Flow Desktop ${VERSION}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Immutable releases cannot be updated; use a new tag or delete the empty failed release before retrying."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$DMG_FILE" \
            "$DARWIN_BUNDLE" \
            "${DARWIN_BUNDLE}.sig" \
            "$WIN_BUNDLE" \
            "${WIN_BUNDLE}.sig" \
            "$MSI_FILE" \
            traceflow-desktop-latest.json \
            --verify-tag \
            --title "$title" \
            --notes-file release-notes.txt \
            --latest
