name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review]
  repository_dispatch:
    types: [linear-triage, linear-implement, linear-mention]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read
  id-token: write

jobs:
  # General Claude assistant for comments (excludes /review and issues)
  claude:
    if: |
      github.event_name != 'repository_dispatch' &&
      github.event_name != 'issues' &&
      !contains(github.event.comment.body, '/review')
    uses: zaks-io/claude-code-action/.github/workflows/claude.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Issue triage with Linear integration
  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: zaks-io/claude-code-action/.github/workflows/issue-triage.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}

  # Code review via /review comment or PR open/ready
  review:
    # Triggers:
    # 1. Manual: /review comment on a PR
    # 2. Auto: PR opened (non-draft)
    # 3. Auto: PR marked ready for review
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review')
    uses: zaks-io/claude-code-action/.github/workflows/code-review.yml@main
    with:
      # 'comment' enables check runs and emoji reactions, 'auto' is streamlined
      trigger_type: ${{ github.event_name == 'issue_comment' && 'comment' || 'auto' }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Linear Agent: Triage
  linear-triage:
    if: github.event.action == 'linear-triage'
    uses: zaks-io/linear-orchestrator/.github/workflows/issue-triage.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}

  # Linear Agent: Implement
  linear-implement:
    if: github.event.action == 'linear-implement'
    uses: zaks-io/linear-orchestrator/.github/workflows/issue-implement.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}

  # Linear Agent: Mention
  linear-mention:
    if: github.event.action == 'linear-mention'
    uses: zaks-io/linear-orchestrator/.github/workflows/issue-mention.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}
