name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  # General Claude assistant for comments (excludes /review and issues)
  claude:
    if: |
      !contains(github.event.comment.body, '/review') &&
      github.event_name != 'issues'
    uses: zaks-io/claude-code-action/.github/workflows/claude.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  # Issue triage with Linear integration
  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: zaks-io/claude-code-action/.github/workflows/issue-triage.yml@main
    with:
      linear_team_prefix: 'ZAK'
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}

  # Code review via /review comment or PR open/ready
  review:
    # Triggers:
    # 1. Manual: /review comment on a PR
    # 2. Auto: PR opened (non-draft)
    # 3. Auto: PR marked ready for review
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review')
    uses: zaks-io/claude-code-action/.github/workflows/code-review.yml@main
    with:
      # 'comment' enables check runs and emoji reactions, 'auto' is streamlined
      trigger_type: ${{ github.event_name == 'issue_comment' && 'comment' || 'auto' }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
