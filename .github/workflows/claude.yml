name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read
  id-token: write

jobs:
  # General Claude assistant for comments (excludes /review and issues)
  claude:
    if: |
      github.event_name != 'issues' &&
      !contains(github.event.comment.body, '/review')
    uses: zaks-io/claude-code-action/.github/workflows/claude.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Issue triage with Linear integration
  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: zaks-io/claude-code-action/.github/workflows/issue-triage.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      linear_api_token: ${{ secrets.LINEAR_API_KEY }}

  # Code review via /review comment on a PR
  review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review')
    uses: zaks-io/claude-code-action/.github/workflows/code-review.yml@main
    with:
      trigger_type: comment
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
