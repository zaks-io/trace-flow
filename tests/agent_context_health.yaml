# Fixtures: fixtures/agent_message_facts.ndjson (org_context).
# Current window [2026-05-20, 2026-05-21): 6 measured assistant calls across 3 sessions.
# Context tokens are input + cache_read + cache_creation, never output/reasoning.
# Per-turn context set (current): {20k, 60k, 90k, 145k, 150k, 220k}.
# Percentiles are TRUE per-turn weighted quantiles (quantileExactWeighted over context_tokens,
# call_count): p10=20k, p50=90k, p90=p95=220k. (These replace the older quantile-of-quantiles
# approximation, which over-reported p50 as 145k.)
# Default threshold is 140000: current calls over threshold are 150k, 220k, and 145k.
# Worst offender = the session whose single worst turn has the highest context_tokens.
# Prior window [2026-05-19, 2026-05-20): 2 measured calls in 1 session (ctx_prior: 100k, 130k).
# retention_days=20000 neutralizes the now()-relative tier floor for fixed-date fixtures.

