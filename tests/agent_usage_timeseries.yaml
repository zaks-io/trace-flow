  expected_result: |
    {"bucket_start":"2026-05-20 10:00:00","group_value":"claude-opus-4-7","message_count":2,"session_count":1,"input_tokens":20,"output_tokens":40,"cache_read_tokens":0,"cache_creation_tokens":0,"reasoning_tokens":0,"total_tokens":60,"cost_usd":0.5,"priced_message_count":2,"tool_event_count":0,"tool_success_count":0,"tool_failure_count":0,"tool_unknown_count":0}
    {"bucket_start":"2026-05-20 10:00:00","group_value":"composer-1","message_count":1,"session_count":1,"input_tokens":0,"output_tokens":0,"cache_read_tokens":0,"cache_creation_tokens":0,"reasoning_tokens":0,"total_tokens":0,"cost_usd":0,"priced_message_count":0,"tool_event_count":0,"tool_success_count":0,"tool_failure_count":0,"tool_unknown_count":0}
    {"bucket_start":"2026-05-20 10:00:00","group_value":"gpt-5.5","message_count":1,"session_count":1,"input_tokens":10,"output_tokens":20,"cache_read_tokens":0,"cache_creation_tokens":0,"reasoning_tokens":0,"total_tokens":30,"cost_usd":0.5,"priced_message_count":1,"tool_event_count":0,"tool_success_count":0,"tool_failure_count":0,"tool_unknown_count":0}

- name: timeseries_respects_source_filter
