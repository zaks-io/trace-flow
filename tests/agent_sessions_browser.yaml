# Fixtures: fixtures/agent_messages.ndjson + fixtures/agent_file_events.ndjson (org_test).
# Per session in window [2026-05-20, 2026-05-21) — all at 2026-05-20 10:00 (duration 0):
#   s1: 3 messages (1.5 + 2.0 + 0.5 = 4.0), 5 file events (5 distinct paths)
#   s2: 1 message (0.1),                     1 file event
#   s3: 2 messages (0.8 + null = 0.8),       2 file events
# last_event_ms = 2026-05-20 10:00:00 UTC = 1779271200000. model resolves to claude-opus-4-7.
# retention_days=20000 neutralizes the now()-relative tier floor (production passes 7..365).

- name: sessions_sort_by_cost_reproduces_outliers
  description: default sort=cost descending reproduces the prior outliers ranking
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000&retention_days=20000
  expected_result: |
    {"session_pk":"s1","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":3,"file_event_count":5,"unique_file_count":5,"cost_usd":4,"duration_ms":0,"last_event_ms":1779271200000}
    {"session_pk":"s3","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":2,"file_event_count":2,"unique_file_count":2,"cost_usd":0.8,"duration_ms":0,"last_event_ms":1779271200000}
    {"session_pk":"s2","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":1,"file_event_count":1,"unique_file_count":1,"cost_usd":0.1,"duration_ms":0,"last_event_ms":1779271200000}

- name: sessions_sort_by_duration_breaks_ties_by_pk
  description: sort=duration (all 0 here) falls back to session_pk ASC, a different order than cost
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000&retention_days=20000&sort=duration
  expected_result: |
    {"session_pk":"s1","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":3,"file_event_count":5,"unique_file_count":5,"cost_usd":4,"duration_ms":0,"last_event_ms":1779271200000}
    {"session_pk":"s2","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":1,"file_event_count":1,"unique_file_count":1,"cost_usd":0.1,"duration_ms":0,"last_event_ms":1779271200000}
    {"session_pk":"s3","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":2,"file_event_count":2,"unique_file_count":2,"cost_usd":0.8,"duration_ms":0,"last_event_ms":1779271200000}

- name: sessions_pagination
  description: limit=1 offset=1 returns the second session by the default cost sort
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000&retention_days=20000&limit=1&offset=1
  expected_result: |
    {"session_pk":"s3","source":"claude","model":"claude-opus-4-7","repo_fingerprint":"repo_abc","message_count":2,"file_event_count":2,"unique_file_count":2,"cost_usd":0.8,"duration_ms":0,"last_event_ms":1779271200000}

- name: sessions_respects_source_filter
  description: sources=codex isolates a source with no org_test sessions -> empty
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000&retention_days=20000&sources=codex
  expected_result: ''
