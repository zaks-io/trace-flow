# Fixtures: fixtures/agent_message_facts.ndjson (org_test), materialized into
# agent_session_summaries. Assistant messages per session in window [2026-05-20, 2026-05-21):
#   s1: cost 1.5+2.0+0.5 = 4.0, 0 generated tokens, last_event 09:00
#   s2: cost 0.1,            0 generated tokens, last_event 10:00
#   s3: cost 0.8 (+1 unpriced), 0 generated tokens, last_event 08:30
# Per-session cost set = {0.1, 0.8, 4.0}: quantileExact(0.5)=0.8, p90=p95=max=4.0. total=4.9.
# Decile cost buckets: edges [min, q10..q90, max] over {0.1,0.8,4.0} collapse (arrayDistinct) to
# [0.1, 0.8, 4.0] -> 2 buckets. Bucket 1 (0.1..0.8] holds {0.1,0.8} (count 2, sum 0.9, first
# bucket includes the min); bucket 2 (0.8..4.0] holds {4.0} (count 1, sum 4.0).
# All generated_tokens=0 -> every edge collapses to a single value [0], so there are no token
# buckets (an all-identical axis can't be bucketed): token_bucket_* arrays are empty. Token
# percentiles all 0.
# Concentration: ceil(3 * 0.1)=1 priciest conversation -> s1, top_10pct_cost=4.0, count=1.
# Curve (priciest-first costs_desc = [4.0, 0.8, 0.1], total 4.9, n=3, P=100 so num_points=3):
#   gini over ascending [0.1,0.8,4.0] = 1 - 2*(0.25+1.2+2.0)/(3*4.9) = 0.5306.
#   half_spend_conv_count = first rank where cum >= 2.45 -> 1 (s1's 4.0 alone clears half).
#   lorenz_conv_pct = [0, 1/3, 2/3, 1]; lorenz_cost_pct = [0, 4/4.9, 4.8/4.9, 1].
# No sessions in the prior window [2026-05-19, 2026-05-20) -> all prior_* columns are 0.
# When BOTH windows are empty the FULL OUTER JOIN ON 1=1 yields no rows (not a zero row);
# the client treats a missing row as no-data, matching agent_sessions_browser.

- name: cost_distribution_current_window_only
  description: per-session cost percentiles, cost/token bands, and top-10% concentration for the current window; prior window is empty
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000
  expected_result: |
    {"session_count":3,"prior_session_count":0,"total_generated_tokens":0,"prior_total_generated_tokens":0,"total_cache_inclusive_tokens":0,"prior_total_cache_inclusive_tokens":0,"total_cost_usd":4.9,"prior_total_cost_usd":0,"cost_p50":0.8,"prior_cost_p50":0,"cost_p90":4,"prior_cost_p90":0,"cost_p95":4,"prior_cost_p95":0,"cost_max":4,"prior_cost_max":0,"generated_tokens_p50":0,"prior_generated_tokens_p50":0,"generated_tokens_p90":0,"prior_generated_tokens_p90":0,"generated_tokens_p95":0,"prior_generated_tokens_p95":0,"generated_tokens_max":0,"prior_generated_tokens_max":0,"cache_inclusive_tokens_p50":0,"prior_cache_inclusive_tokens_p50":0,"cache_inclusive_tokens_p90":0,"prior_cache_inclusive_tokens_p90":0,"cache_inclusive_tokens_p95":0,"prior_cache_inclusive_tokens_p95":0,"cache_inclusive_tokens_max":0,"prior_cache_inclusive_tokens_max":0,"cost_bucket_lo":[0.1,0.8],"cost_bucket_hi":[0.8,4],"cost_bucket_count":[2,1],"cost_bucket_sum":[0.9,4],"token_bucket_lo":[],"token_bucket_hi":[],"token_bucket_count":[],"token_bucket_sum":[],"top_10pct_cost_usd":4,"top_10pct_session_count":1,"gini":0.5306,"half_spend_conv_count":1,"lorenz_conv_pct":[0,0.3333333333333333,0.6666666666666666,1],"lorenz_cost_pct":[0,0.816326530612245,0.979591836734694,1]}

- name: cost_distribution_respects_source_filter
  description: sources=codex isolates a source with no org_test sessions; both windows empty -> no rows (the client renders this as no-data, like agent_sessions_browser)
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000&sources=codex
