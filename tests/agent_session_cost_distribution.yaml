# Fixtures: fixtures/agent_message_facts.ndjson (org_test), materialized into
# agent_session_summaries. Assistant messages per session in window [2026-05-20, 2026-05-21):
#   s1: cost 1.5+2.0+0.5 = 4.0, 0 generated tokens, last_event 09:00
#   s2: cost 0.1,            0 generated tokens, last_event 10:00
#   s3: cost 0.8 (+1 unpriced), 0 generated tokens, last_event 08:30
# Per-session cost set = {0.1, 0.8, 4.0}: quantileExact(0.5)=0.8, p90=p95=max=4.0. total=4.9.
# Cost bands: 10c_1 holds {0.1, 0.8} (2 sessions, sum 0.9); 1_5 holds {4.0} (1 session, sum 4.0).
# All generated_tokens=0 -> every session lands in token_bin_under_10k. Token percentiles all 0.
# Concentration: ceil(3 * 0.1)=1 priciest conversation -> s1, top_10pct_cost=4.0, count=1.
# No sessions in the prior window [2026-05-19, 2026-05-20) -> all prior_* columns are 0.
# When BOTH windows are empty the FULL OUTER JOIN ON 1=1 yields no rows (not a zero row);
# the client treats a missing row as no-data, matching agent_sessions_browser.

- name: cost_distribution_current_window_only
  description: per-session cost percentiles, cost/token bands, and top-10% concentration for the current window; prior window is empty
  expected_http_status: 200
  parameters: org_id=org_test&start_time_ms=1779235200000&end_time_ms=1779321600000
  expected_result: |
    {"session_count":3,"prior_session_count":0,"total_generated_tokens":0,"prior_total_generated_tokens":0,"total_cache_inclusive_tokens":0,"prior_total_cache_inclusive_tokens":0,"total_cost_usd":4.9,"prior_total_cost_usd":0,"cost_p50":0.8,"prior_cost_p50":0,"cost_p90":4,"prior_cost_p90":0,"cost_p95":4,"prior_cost_p95":0,"cost_max":4,"prior_cost_max":0,"generated_tokens_p50":0,"prior_generated_tokens_p50":0,"generated_tokens_p90":0,"prior_generated_tokens_p90":0,"generated_tokens_p95":0,"prior_generated_tokens_p95":0,"generated_tokens_max":0,"prior_generated_tokens_max":0,"cache_inclusive_tokens_p50":0,"prior_cache_inclusive_tokens_p50":0,"cache_inclusive_tokens_p90":0,"prior_cache_inclusive_tokens_p90":0,"cache_inclusive_tokens_p95":0,"prior_cache_inclusive_tokens_p95":0,"cache_inclusive_tokens_max":0,"prior_cache_inclusive_tokens_max":0,"cost_bin_under_10c":0,"cost_bin_10c_1":2,"cost_bin_1_5":1,"cost_bin_5_20":0,"cost_bin_20_plus":0,"cost_sum_under_10c":0,"cost_sum_10c_1":0.9,"cost_sum_1_5":4,"cost_sum_5_20":0,"cost_sum_20_plus":0,"token_bin_under_10k":3,"token_bin_10k_50k":0,"token_bin_50k_200k":0,"token_bin_200k_1m":0,"token_bin_1m_plus":0,"token_sum_under_10k":0,"token_sum_10k_50k":0,"token_sum_50k_200k":0,"token_sum_200k_1m":0,"token_sum_1m_plus":0,"top_10pct_cost_usd":4,"top_10pct_session_count":1}

- name: cost_distribution_respects_source_filter
  description: sources=codex isolates a source with no org_test sessions; both windows empty -> no rows (the client renders this as no-data, like agent_sessions_browser)
  expected_http_status: 200
