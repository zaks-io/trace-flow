# Fixtures: fixtures/agent_message_facts.ndjson (org_depth_outlier). Five identical 6-turn
# conversations (do1..do5). cost_usd = depth+1 at depths 0..4 but a runaway 1000 at depth 5;
# context = 10000*(depth+1) at every depth (linear, no outlier). So the per-depth median costs
# are [1,2,3,4,5,1000] and median contexts are [10000..60000]. This is the Theil–Sen vs OLS test:
#   - Theil–Sen cost slope = median of the 15 pairwise slopes of ln(median cost) on ln(depth+1).
#     14 of 15 pairs sit on the cost=depth+1 line (slope 1); only pairs touching depth 5 are steep.
#     The median pairwise slope is exactly 1.0 -> the outlier does NOT move the elasticity.
#     (OLS on the same points would be ~2.62, dragged up by the single outlier depth — the exact
#     failure mode ADR 0021 §Relationship calls out. This fixture pins the robust behavior.)
#   - context is a clean line -> context_elasticity = 1.0.
# All six depths have sample_count=5 >= 5 and positive medians: cost_fit_points = context_fit_points = 6,
# well_sampled=1 everywhere, charted/observed_max_depth=5, nothing pooled.
- name: cost_by_depth_theil_sen_ignores_outlier_depth
  description: a single runaway-cost depth leaves the Theil–Sen cost elasticity at 1.0 (OLS would be dragged to ~2.62), proving the robust slope estimator
  expected_http_status: 200
  parameters: org_id=org_depth_outlier&start_time_ms=1779235200000&end_time_ms=1779321600000
