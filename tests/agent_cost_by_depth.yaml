# Fixtures: fixtures/agent_message_facts.ndjson (org_depth_even). Five identical 4-turn
# conversations (de1..de5). cost_usd = [1,2,4,8] at depths 0..3; context = 10000*(depth+1).
# Regression guard for the Theil-Sen median ESTIMATOR (medianExact, not the `median` alias):
# 4 well-sampled depths -> 6 pairwise cost slopes [1.0, 1.2619, 1.5, 1.7095, 2.0, 2.4094] (EVEN
# count). The exact order statistic `medianExact` returns the upper of the two central values
# (index n/2, the 4th slope) = 1.7095; the interpolating `median` alias would AVERAGE the two
# central values (1.5, 1.7095) = 1.6048. So a revert to `median` flips cost_elasticity
# 1.7095 -> 1.6048, and this test catches it (the odd-count fixtures above cannot — their central
# slope is a repeated 1.0, where both estimators agree). context is a clean line -> every pairwise
# slope is 1.0 -> context_elasticity = 1.0. All four depths have sample_count=5.
- name: cost_by_depth_theil_sen_uses_exact_median_estimator
  description: even-count pairwise-slope array pins medianExact (1.7095), distinguishing it from the interpolating median alias (1.6048) — guards the house exact-estimator choice
  expected_http_status: 200
  parameters: org_id=org_depth_even&start_time_ms=1779235200000&end_time_ms=1779321600000
  expected_result: |
    {"depth":0,"sample_count":5,"priced_sample_count":5,"min_depth_samples":5,"well_sampled":1,"cost_p25":1,"cost_p50":1,"cost_p75":1,"cost_p95":1,"context_p25":10000,"context_p50":10000,"context_p75":10000,"context_p95":10000,"cost_elasticity":1.7095,"context_elasticity":1,"cost_fit_points":4,"context_fit_points":4,"fit_sampled":0,"charted_max_depth":3,"observed_max_depth":3,"pooled_depth_count":0,"pooled_turn_count":0}
