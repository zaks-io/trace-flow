# Fixtures: fixtures/agent_message_facts.ndjson (org_depth). Five identical 6-turn conversations
# (d1..d5), all assistant turns in window [2026-05-20, 2026-05-21):
#   at turn_index d (0..5): cost_usd = d+1, context = input+cache_read+cache_creation = 10000*(d+1).
# So every depth has sample_count=5 (>= default min_depth_samples=5) and an exact median:
#   cost_p* = d+1, context_p* = 10000*(d+1) (all five sessions tie, so p25=p50=p75=p95).
# Elasticity is the Theil–Sen slope (median of pairwise slopes) of ln(median) on ln(depth+1).
# Because cost = depth+1 exactly, ln(cost) == ln(depth+1): every pairwise slope is exactly 1.0,
# so their median is 1.0. context = 10000*(depth+1), so ln(context) = ln(10000) + ln(depth+1) ->
# every pairwise slope is 1.0 -> median 1.0. (On a perfect line Theil–Sen and OLS agree; the
# robustness difference shows only when an outlier depth is present — see org_depth_outlier below.)
# All six depths clear min_depth_samples and have positive medians, so cost_fit_points = context_fit_points = 6.
# A slope of 1.0 reads as "each doubling of depth doubles per-turn cost" — linear context bloat.
# Every depth has sample_count=5 >= 5 so well_sampled=1 and none is pooled out: charted_max_depth=5,
# observed_max_depth=5, pooled_depth_count=0, pooled_turn_count=0 (the same window scalars on each row).

- name: cost_by_depth_linear_bloat_slope_is_one
  description: per-depth cost/context bands plus a log-log elasticity of exactly 1.0 over five identical 6-turn conversations
  expected_http_status: 200
  parameters: org_id=org_depth&start_time_ms=1779235200000&end_time_ms=1779321600000
  expected_result: |
    {"depth":0,"sample_count":5,"priced_sample_count":5,"min_depth_samples":5,"well_sampled":1,"cost_p25":1,"cost_p50":1,"cost_p75":1,"cost_p95":1,"context_p25":10000,"context_p50":10000,"context_p75":10000,"context_p95":10000,"cost_elasticity":1,"context_elasticity":1,"cost_fit_points":6,"context_fit_points":6,"fit_sampled":0,"charted_max_depth":5,"observed_max_depth":5,"pooled_depth_count":0,"pooled_turn_count":0}
