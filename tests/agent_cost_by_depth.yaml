# Fixtures: fixtures/agent_message_facts.ndjson (org_subagent). One session sa1 with main-thread
# assistant turns at depth 0 (cost 100) and depth 1 (cost 200). At the SAME (session_pk, turn_index)
# there are sub-agent turns (agent_depth=1, cost 999) and a sidechain turn (is_sidechain=1, cost 888) —
# a Claude sub-agent transcript shares the parent session_pk but restarts turn_index, so it collides.
# The pipe filters agent_depth=0 AND is_sidechain=0, so only the two main-thread turns survive:
# sample_count stays 1 per depth (no double-count), and no 999/888 cost leaks into the bands. Both
# depths fall below min_depth_samples=5, so neither enters the fit -> elasticity 0, fit_points 0.
# Both are also below the chart threshold: well_sampled=0, charted_max_depth=0 (no well-sampled depth),
# observed_max_depth=1, and both depths/turns are pooled out (pooled_depth_count=2, pooled_turn_count=2).
- name: cost_by_depth_excludes_subagent_and_sidechain_collisions
  description: sub-agent (agent_depth>0) and sidechain turns sharing (session_pk, turn_index) are dropped, so sample_count is not inflated and their cost never leaks into the bands
  expected_http_status: 200
