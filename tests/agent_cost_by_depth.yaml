    {"depth":2,"sample_count":5,"priced_sample_count":5,"min_depth_samples":5,"well_sampled":1,"cost_p25":3,"cost_p50":3,"cost_p75":3,"cost_p95":3,"context_p25":30000,"context_p50":30000,"context_p75":30000,"context_p95":30000,"cost_elasticity":1,"context_elasticity":1,"cost_fit_points":6,"context_fit_points":6,"fit_sampled":0,"charted_max_depth":5,"observed_max_depth":5,"pooled_depth_count":0,"pooled_turn_count":0}
    {"depth":3,"sample_count":5,"priced_sample_count":5,"min_depth_samples":5,"well_sampled":1,"cost_p25":4,"cost_p50":4,"cost_p75":4,"cost_p95":4,"context_p25":40000,"context_p50":40000,"context_p75":40000,"context_p95":40000,"cost_elasticity":1,"context_elasticity":1,"cost_fit_points":6,"context_fit_points":6,"fit_sampled":0,"charted_max_depth":5,"observed_max_depth":5,"pooled_depth_count":0,"pooled_turn_count":0}
