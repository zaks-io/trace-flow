[package]
name = "collector-archive-sync"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Encrypted Desktop Archive Spool and Archive API uploader, separate from parsed fact sync."

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
collector-archive = { path = "../collector-archive" }
collector-contracts = { path = "../collector-contracts" }
getrandom = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
