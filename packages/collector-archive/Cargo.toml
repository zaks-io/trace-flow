[package]
name = "collector-archive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lossless Claude and Codex Conversation Archive contracts."

[dependencies]
base64 = "0.22"
collector-contracts = { path = "../collector-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
proptest = "1"
