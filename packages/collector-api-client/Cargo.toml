[package]
name = "collector-api-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HTTP client for the Trace Flow agent Collector ingest worker."

[dependencies]
anyhow = "1"
collector-contracts = { path = "../collector-contracts" }
flate2 = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
