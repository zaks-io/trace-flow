name = "observe-proxy-consumer"
main = "src/index.ts"
compatibility_date = "2024-11-27"

[observability]
enabled = true

[placement]
mode = "smart"

# Durable Object for batching traces
[[durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TraceBatcher"]

# Queue consumer configuration
[[queues.consumers]]
queue = "observe-requests-dev"
max_batch_size = 1000
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "observe-requests-dlq-dev"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-dev"

# Tinybird configuration
# TINYBIRD_TOKEN - Auth token with DATASOURCE:APPEND scope (set via wrangler secret)
# TINYBIRD_DATASOURCE - Data source name (optional, defaults to "otel_traces")
# TINYBIRD_HOST - API host (optional, defaults to "https://api.tinybird.co")

[env.staging]
name = "observe-proxy-consumer-staging"

[[env.staging.durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[env.staging.queues.consumers]]
queue = "observe-requests-staging"
max_batch_size = 1000
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "observe-requests-dlq-staging"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-staging"

[env.production]
name = "observe-proxy-consumer"

[[env.production.durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[env.production.queues.consumers]]
queue = "observe-requests-prod"
max_batch_size = 1000
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "observe-requests-dlq-prod"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-prod"
