name = "observe-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-27"

[observability]
enabled = true

# KV Namespace for API key validation (dev)
[[kv_namespaces]]
binding = "API_KEYS"
id = "86d6aaf858e747e4bd9aa0a51216570d"
# preview_id = "86d6aaf858e747e4bd9aa0a51216570d"

# Queue for async processing
[[queues.producers]]
queue = "llm-requests"
binding = "REQUEST_QUEUE"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage"

[env.staging]
name = "observe-proxy-staging"

[[env.staging.kv_namespaces]]
binding = "API_KEYS"
id = "REPLACE_WITH_STAGING_NAMESPACE_ID"

[env.production]
name = "observe-proxy"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "REPLACE_WITH_PRODUCTION_NAMESPACE_ID"
