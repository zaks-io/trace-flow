name = "observe-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-27"

[observability]
enabled = true

# KV Namespace for API key validation (dev)
[[kv_namespaces]]
binding = "API_KEYS"
id = "86d6aaf858e747e4bd9aa0a51216570d"
# preview_id = "86d6aaf858e747e4bd9aa0a51216570d"

# Queue for async processing
[[queues.producers]]
queue = "observe-requests-dev"
binding = "REQUEST_QUEUE"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-dev"

[env.production]
name = "observe-proxy"

[[env.production.routes]]
pattern = "gateway.trace-flow.dev/*"
zone_name = "trace-flow.dev"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "6d74d697f808470bbb678eda3c52bef3"

[[env.production.queues.producers]]
queue = "observe-requests-prod"
binding = "REQUEST_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-prod"

[env.preview]
name = "observe-proxy-preview"

[[env.preview.kv_namespaces]]
binding = "API_KEYS"
id = "86d6aaf858e747e4bd9aa0a51216570d"

[[env.preview.queues.producers]]
queue = "observe-requests-preview"
binding = "REQUEST_QUEUE"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "observe-storage-dev"
