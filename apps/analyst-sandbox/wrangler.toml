name = "trace-flow-analyst-sandbox-dev"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

logpush = true

[observability.traces]
enabled = true
destinations = ["axiom-traces"]
head_sampling_rate = 1

[observability.logs]
enabled = true
destinations = ["axiom-logs"]
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

# Secrets: ANALYST_SANDBOX_SHARED_SECRET, OPENROUTER_API_KEY
# Dev var: CONVEX_URL. Preview/prod deploy workflows inject it from Convex output.
# Snapshots stream through the Worker to the BACKUP_BUCKET binding — the sealed
# container makes no R2 calls, so no presigned-URL config (endpoint, account id,
# R2 API token secrets) is needed.

[vars]
CONVEX_URL = "https://hardy-iguana-812.convex.cloud"
SENTRY_ENVIRONMENT = "development"
SANDBOX_TRANSPORT = "http"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "trace-flow-analyst-sandbox-backups-dev"

# Bind by ID (never by CF title) — proxy-consumer binds the same namespaces by ID.
[[kv_namespaces]]
binding = "MODEL_PRICING"
id = "25a35f71a8d64884a8e8935056880dba"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 5

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[env.preview]
name = "trace-flow-analyst-sandbox-preview"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
CONVEX_URL = ""
SENTRY_ENVIRONMENT = "preview"
SANDBOX_TRANSPORT = "rpc"

[[env.preview.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "trace-flow-analyst-sandbox-backups-preview"

# Preview shares the Convex dev deployment, so it uses the dev MODEL_PRICING namespace.
[[env.preview.kv_namespaces]]
binding = "MODEL_PRICING"
id = "25a35f71a8d64884a8e8935056880dba"

[[env.preview.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 5

[[env.preview.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[env.production]
name = "trace-flow-analyst-sandbox"
workers_dev = false

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
CONVEX_URL = ""
SENTRY_ENVIRONMENT = "prod"
SANDBOX_TRANSPORT = "rpc"

[[env.production.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "trace-flow-analyst-sandbox-backups-production"

[[env.production.kv_namespaces]]
binding = "MODEL_PRICING"
id = "45dd0d5e619d44fc831ccab01ed428a4"

[[env.production.routes]]
pattern = "analyst-sandbox.trace-flow.dev"
custom_domain = true

[[env.production.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 10

[[env.production.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]
