[package]
name = "trace-flow-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Trace Flow Collector CLI: login, sources, sync, status, disconnect"

# The binary users invoke is `trace-flow`, not the crate name.
[[bin]]
name = "trace-flow"
path = "src/main.rs"

[dependencies]
collector-contracts = { path = "../../packages/collector-contracts" }
collector-parser = { path = "../../packages/collector-parser" }
collector-sync = { path = "../../packages/collector-sync" }
collector-api-client = { path = "../../packages/collector-api-client" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
# CSPRNG for the one-time login state nonce that ties the loopback callback to the request the CLI
# initiated (rejects stray/malicious local requests racing the listener).
getrandom = "0.4"
# keyring has NO default features: with none enabled it silently falls back to a per-process
# in-memory mock store, so `set` succeeds and the next process's `get` returns NoEntry. Enable the
# real OS-native backend per platform (macOS/Windows native; Linux Secret Service over sync DBus).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# `buffer_unordered` overlaps the per-session assembly (file read + parse + git resolve) so a history
# import does not read transcripts one at a time. Stream combinators only.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tiny_http = "0.12"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
