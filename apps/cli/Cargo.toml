[package]
name = "trace-flow-cli"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Trace Flow Collector CLI: login, sources, sync, status, disconnect"
repository = "https://github.com/zaks-io/trace-flow"
homepage = "https://trace-flow.dev"

[package.metadata.dist]
dist = true

# The binary users invoke is `trace-flow`, not the crate name.
[[bin]]
name = "trace-flow"
path = "src/main.rs"

[dependencies]
# The shared embedder (login, keychain, connection state, source detection, sync drive loop, prod
# endpoint defaults). The CLI is a thin clap + stdout shim over it; the desktop app links the same crate.
collector-embedder = { path = "../../packages/collector-embedder" }
collector-contracts = { path = "../../packages/collector-contracts" }
# Used directly only by the hidden `cursor-dryrun` verification command: read the local
# Cursor state.vscdb and print aggregate counts without uploading.
collector-parser = { path = "../../packages/collector-parser" }
collector-sync = { path = "../../packages/collector-sync" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
