name = "trace-flow-consumer-dev"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]
upload_source_maps = true

logpush = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
SENTRY_ENVIRONMENT = "development"
AXIOM_DATASET = "trace-flow-logs"
TINYBIRD_HOST = "https://api.us-west-2.aws.tinybird.co"

[placement]
mode = "smart"

[triggers]
crons = ["*/5 * * * *"]

# Durable Object for batching traces
[[durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TraceBatcher"]

# Queue consumer configuration
[[queues.consumers]]
queue = "trace-flow-requests-dev"
max_batch_size = 100
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "trace-flow-requests-dlq-dev"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

# Model pricing KV namespace
[[kv_namespaces]]
binding = "MODEL_PRICING"
id = "25a35f71a8d64884a8e8935056880dba"

# Analytics Engine for batcher queue depth metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-consumer-dev"

# Tinybird configuration
# TINYBIRD_TOKEN - Auth token with DATASOURCE:APPEND scope (set via wrangler secret)
# TINYBIRD_DATASOURCE - Data source name (optional, defaults to "otel_traces")
# TINYBIRD_HOST - API host (regional endpoint, e.g. "https://api.us-west-2.aws.tinybird.co")
# AXIOM_TOKEN - Auth token for Axiom ingest (set via wrangler secret)

[env.production]
name = "trace-flow-consumer"
workers_dev = false

[env.production.vars]
SENTRY_ENVIRONMENT = "production"
AXIOM_DATASET = "trace-flow-logs"
TINYBIRD_HOST = "https://api.us-west-2.aws.tinybird.co"

[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.production.durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[env.production.queues.consumers]]
queue = "trace-flow-requests-prod"
max_batch_size = 100
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "trace-flow-requests-dlq-prod"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-prod"

[[env.production.kv_namespaces]]
binding = "MODEL_PRICING"
id = "45dd0d5e619d44fc831ccab01ed428a4"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-consumer"

[env.preview]
name = "trace-flow-consumer-preview"

[env.preview.vars]
SENTRY_ENVIRONMENT = "preview"
AXIOM_DATASET = "trace-flow-logs"
TINYBIRD_HOST = "https://api.us-west-2.aws.tinybird.co"

[env.preview.triggers]
crons = ["*/5 * * * *"]

[[env.preview.durable_objects.bindings]]
name = "TRACE_BATCHER"
class_name = "TraceBatcher"

[[env.preview.queues.consumers]]
queue = "trace-flow-requests-preview"
max_batch_size = 100
max_batch_timeout = 5
max_concurrency = 20
max_retries = 5
dead_letter_queue = "trace-flow-requests-dlq-preview"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

[[env.preview.kv_namespaces]]
binding = "MODEL_PRICING"
id = "25a35f71a8d64884a8e8935056880dba"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-consumer-dev"
