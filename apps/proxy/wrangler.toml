name = "trace-flow-proxy-dev"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]
upload_source_maps = true

logpush = true

[observability.traces]
enabled = true
destinations = ["axiom-traces"]
head_sampling_rate = 1

[observability.logs]
enabled = true
destinations = ["axiom-logs"]
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
SENTRY_ENVIRONMENT = "development"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

# KV Namespace for API key validation (dev)
[[kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

# Queue for async processing
[[queues.producers]]
queue = "trace-flow-requests-dev"
binding = "REQUEST_QUEUE"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

# Analytics Engine for operational KPMs (latency, error rate, skip rate)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy-dev"

# Per-org burst limit on LLM proxy + OTLP ingest
[[ratelimits]]
name = "ORG_LIMITER"
namespace_id = "2001"
simple = { limit = 300, period = 60 }

# Per-IP defensive baseline (catches leaked keys and runaway scripts)
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

# Deploy var required: CONVEX_SITE_URL (https://{deployment}.convex.site)
# Secrets required: USAGE_SYNC_SECRET, SENTRY_DSN, AXIOM_TOKEN, BODY_ENCRYPTION_ROOT_KEY

# Durable Object for usage tracking
[[durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageTracker"]

[env.production]
name = "trace-flow-proxy"
workers_dev = false

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
SENTRY_ENVIRONMENT = "prod"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.production.routes]]
pattern = "gateway.trace-flow.dev/*"
zone_name = "trace-flow.dev"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "f004c21e2b8c4754af5947c08069bd00"

[[env.production.queues.producers]]
queue = "trace-flow-requests-prod"
binding = "REQUEST_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-prod"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy"

[[env.production.ratelimits]]
name = "ORG_LIMITER"
namespace_id = "2001"
simple = { limit = 300, period = 60 }

[[env.production.ratelimits]]
name = "IP_LIMITER"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

[[env.production.durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[env.preview]
name = "trace-flow-proxy-preview"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
SENTRY_ENVIRONMENT = "preview"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.preview.kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

[[env.preview.queues.producers]]
queue = "trace-flow-requests-preview"
binding = "REQUEST_QUEUE"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy-dev"

[[env.preview.ratelimits]]
name = "ORG_LIMITER"
namespace_id = "2001"
simple = { limit = 300, period = 60 }

[[env.preview.ratelimits]]
name = "IP_LIMITER"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

[[env.preview.durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"
