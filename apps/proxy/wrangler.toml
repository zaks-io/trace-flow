name = "trace-flow-proxy-dev"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]
upload_source_maps = true

logpush = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
SENTRY_ENVIRONMENT = "development"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

# KV Namespace for API key validation (dev)
[[kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

# Queue for async processing
[[queues.producers]]
queue = "trace-flow-requests-dev"
binding = "REQUEST_QUEUE"

# R2 bucket for storing request/response bodies
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

# Analytics Engine for operational KPMs (latency, error rate, skip rate)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy-dev"

# Secrets required: CONVEX_SITE_URL (https://{deployment}.convex.site), USAGE_SYNC_SECRET, SENTRY_DSN, AXIOM_TOKEN, BODY_ENCRYPTION_ROOT_KEY

# Durable Object for usage tracking
[[durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageTracker"]

[env.production]
name = "trace-flow-proxy"
workers_dev = false

[env.production.vars]
SENTRY_ENVIRONMENT = "production"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.production.routes]]
pattern = "gateway.trace-flow.dev/*"
zone_name = "trace-flow.dev"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "f004c21e2b8c4754af5947c08069bd00"

[[env.production.queues.producers]]
queue = "trace-flow-requests-prod"
binding = "REQUEST_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-prod"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy"

[[env.production.durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

[env.preview]
name = "trace-flow-proxy-preview"

[env.preview.vars]
SENTRY_ENVIRONMENT = "preview"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.preview.kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

[[env.preview.queues.producers]]
queue = "trace-flow-requests-preview"
binding = "REQUEST_QUEUE"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "trace-flow-proxy-dev"

[[env.preview.durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"
