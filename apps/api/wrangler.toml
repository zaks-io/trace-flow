name = "trace-flow-raw-api-dev"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]
upload_source_maps = true

logpush = true

[observability.traces]
enabled = true
destinations = ["axiom-traces"]
head_sampling_rate = 1

[observability.logs]
enabled = true
destinations = ["axiom-logs"]
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

# Secrets: AXIOM_TOKEN, BODY_ENCRYPTION_ROOT_KEY, BODY_ACCESS_JWT_SECRET

[vars]
SENTRY_ENVIRONMENT = "development"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

[[kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

# Per-user rate limit on body retrieval (enumeration protection)
[[ratelimits]]
name = "BODIES_LIMITER"
namespace_id = "2003"
simple = { limit = 120, period = 60 }

[env.production]
name = "trace-flow-raw-api"
workers_dev = false

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
SENTRY_ENVIRONMENT = "prod"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.production.routes]]
pattern = "raw.trace-flow.dev/*"
zone_name = "trace-flow.dev"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-prod"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "f004c21e2b8c4754af5947c08069bd00"

[[env.production.ratelimits]]
name = "BODIES_LIMITER"
namespace_id = "2011"
simple = { limit = 120, period = 60 }

[env.preview]
name = "trace-flow-raw-api-preview"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
SENTRY_ENVIRONMENT = "preview"
AXIOM_DATASET = "cloudflare"
BODY_ENCRYPTION_KEY_ID = "v1"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "trace-flow-storage-dev"

[[env.preview.kv_namespaces]]
binding = "API_KEYS"
id = "30c9a31ff3af4b408b4d64b8ecfa98a5"

[[env.preview.ratelimits]]
name = "BODIES_LIMITER"
namespace_id = "2012"
simple = { limit = 120, period = 60 }
