<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace Flow Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #16181d;
        --muted: #6b7280;
        --bg: #ffffff;
        --card: #f6f7f9;
        --accent: #4f46e5;
        --accent-fg: #ffffff;
        --border: #e5e7eb;
        --ok: #15803d;
        --warn: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e8eb;
          --muted: #9aa1ab;
          --bg: #15171c;
          --card: #1d2027;
          --border: #2b2f38;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        margin: 0;
        padding: 20px;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 16px;
        margin: 0 0 2px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
      }
      .src-name {
        font-weight: 600;
      }
      .src-meta {
        color: var(--muted);
      }
      .tag {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      .tag.ready {
        color: var(--ok);
      }
      .tag.unsupported {
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        cursor: pointer;
        width: 100%;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .stack > * + * {
        margin-top: 8px;
      }
      label.toggle {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        cursor: pointer;
      }
      label.toggle .desc {
        color: var(--muted);
        font-size: 12px;
      }
      .status-line {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.connected {
        background: var(--ok);
      }
      .msg {
        color: var(--warn);
        min-height: 18px;
      }
      .footer {
        color: var(--muted);
        font-size: 11px;
        margin-top: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Trace Flow Desktop</h1>
    <p class="sub">Sync your local coding-agent transcripts to Trace Flow.</p>

    <div class="card">
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span id="status">Checking…</span>
      </div>
    </div>

    <div class="card">
      <div class="row"><strong>Detected sources</strong></div>
      <div id="sources"></div>
    </div>

    <div class="card">
      <label class="toggle">
        <input type="checkbox" id="raw-upload" />
        <span>
          <strong>Upload raw transcripts</strong>
          <div class="desc">Off by default. When off, only redacted facts leave your machine.</div>
        </span>
      </label>
    </div>

    <div class="stack">
      <button class="primary" id="connect">Connect…</button>
      <button class="primary" id="start" disabled>Start syncing</button>
      <button class="secondary" id="sync-now" disabled>Sync now</button>
      <button class="secondary" id="disconnect" disabled>Disconnect</button>
    </div>

    <p class="msg" id="msg"></p>
    <p class="footer">Nothing is uploaded until you click <strong>Start syncing</strong>.</p>

    <script src="./main.js"></script>
  </body>
</html>
