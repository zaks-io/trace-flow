[package]
name = "trace-flow-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Trace Flow Desktop: the menu-bar Collector that syncs local Claude/Codex transcripts (TRA-115)"

[package.metadata.dist]
dist = false

[lib]
name = "trace_flow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The same embedder the CLI links: login, keychain, connection state, source detection, the sync drive
# loop, and prod endpoint defaults. One code path, no drift between CLI and desktop.
collector-embedder = { path = "../../../packages/collector-embedder" }
collector-contracts = { path = "../../../packages/collector-contracts" }

anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
